 if(j.status==='Closed'&&status!=='Booked')return;
 j.status=status;
 if(status==='Collect'){
   j.collectNotifiedAt=new Date().toISOString();
   addNotification('alert','Portaloo collection due',`${j.name}: collection is due.`,`portaloo-collect-${j.id}-${j.endDate||'manual'}`,{phone:true});
   logActivity({itemName:j.name,action:'Portaloo collection requested',job:j.name,at:new Date().toISOString()});
 }
 save();viewPortalooJob(id);renderPortaloo();
}

function savePortalooService(id){const j=data.portalooJobs.find(x=>x.id===id);if(!j)return;if(!j.services)j.services=[];const serviceDate=v('ps_date')||new Date().toISOString().slice(0,10);const serviceType=v('ps_type')||'Service';j.services.push({id:makeId('service'),date:serviceDate,type:serviceType,crewIds:[...document.querySelectorAll('.portaloo-service-user:checked')].map(x=>x.value),notes:v('ps_notes')});if(['Routine service','Clean / pump out'].includes(serviceType)){const next=new Date(serviceDate+'T00:00:00');next.setDate(next.getDate()+7);j.nextServiceDate=next.toISOString().slice(0,10);}logActivity({itemName:j.name,action:'Portaloo service logged',job:j.name,at:new Date().toISOString()});save();closeModal();viewPortalooJob(id);renderPortaloo(); if(googleAccessToken)syncGoogleJob(j,'portaloo').catch(e=>console.error(e));}
function deletePortalooService(jobId,serviceId){const j=data.portalooJobs.find(x=>x.id===jobId);if(!j)return;if(!confirm('Delete this service record?'))return;j.services=(j.services||[]).filter(s=>s.id!==serviceId);save();viewPortalooJob(jobId);renderPortaloo(); if(googleAccessToken)syncGoogleJob(j,'portaloo').catch(e=>console.error(e));}
function editPortalooJob(id){const j=data.portalooJobs.find(x=>x.id===id);if(!j)return;openModal(`<h2>Edit Portaloo job</h2><label>Job / site name</label><input id="ep_name" value="${esc(j.name)}"><label>What3words location</label><input id="ep_location" value="${esc(j.what3words||j.location||'')}" placeholder="///filled.count.soap"><div style="display:flex;gap:8px"><button class="maps-btn" style="flex:1" onclick="openWhat3WordsFor('ep_location')">📍 Open in What3words</button><button class="secondary" onclick="openWhat3WordsAppFor('ep_location')">🔎 Find</button></div><label>Start date</label><input id="ep_start" type="date" value="${esc(j.startDate||'')}"><label style="display:flex;align-items:center;gap:9px;margin:4px 0 10px"><input id="ep_rolling" type="checkbox" style="width:22px;height:22px;margin:0" ${j.rolling?'checked':''} onchange="document.getElementById('ep_end').disabled=this.checked"> Rolling / no fixed end date</label><label>End date</label><input id="ep_end" type="date" value="${esc(j.endDate||'')}" ${j.rolling?'disabled':''}><h3>Portaloo stock on hire</h3><div>${portalooStockBookingHTML('epstock',j.stockAllocations||{})}</div><p class="small">The quantities above are the actual stock reserved for this long-term hire. Changing them changes the available Portaloo stock.</p><h3>Customer</h3><label>Name</label><input id="ep_customer_name" value="${esc(j.customer?.name||'')}"><label>Company</label><input id="ep_customer_company" value="${esc(j.customer?.company||'')}"><label>Phone</label><input id="ep_customer_phone" value="${esc(j.customer?.phone||'')}"><label>Email</label><input id="ep_customer_email" value="${esc(j.customer?.email||'')}"><label>General notes</label><textarea id="ep_notes" rows="4" style="width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;font:inherit">${esc(j.notes||'')}</textarea><button onclick="savePortalooJob('${id}')">Save changes</button>`)}
function savePortalooJob(id){const j=data.portalooJobs.find(x=>x.id===id);if(!j)return;const old=j.stockAllocations||{};const requested=readPortalooStockBooking();for(const [stockId,q] of Object.entries(requested)){const oldQ=Number(old[stockId])||0;const x=data.portalooEquipment.find(i=>i.id===stockId);if(x&&stockAvailable(x)+oldQ<q)return alert(`Not enough ${x.name} stock available.`)}Object.entries(old).forEach(([stockId,q])=>{const nq=Number(requested[stockId])||0;const x=data.portalooEquipment.find(i=>i.id===stockId);if(x&&nq<q)releaseStock(x,j.id,q-nq)});Object.entries(requested).forEach(([stockId,q])=>{const oq=Number(old[stockId])||0;const x=data.portalooEquipment.find(i=>i.id===stockId);if(x&&q>oq)allocateStock(x,j.id,q-oq)});j.stockAllocations=requested;j.name=v('ep_name')||j.name;j.what3words=v('ep_location');j.location='';j.startDate=v('ep_start');j.rolling=document.getElementById('ep_rolling')?.checked||false;j.endDate=j.rolling?'':v('ep_end');j.unit1=0;j.unit2=0;j.unit3=0;j.customer={name:v('ep_customer_name'),company:v('ep_customer_company'),phone:v('ep_customer_phone'),email:v('ep_customer_email')};j.notes=v('ep_notes');save();closeModal();viewPortalooJob(id);renderPortaloo();if(googleAccessToken)syncGoogleJob(j,'portaloo').catch(e=>console.error(e));}
function deletePortalooJob(id){const j=data.portalooJobs.find(x=>x.id===id);if(!j)return;openModal(`<h2>Delete Portaloo job?</h2><p>Are you sure you want to delete <b>${esc(j.name)}</b>?</p><p class="muted">This will permanently remove the job and its service history from this device.</p><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="danger" onclick="confirmDeletePortalooJob('${id}')">Yes, delete job</button></div>`)}
function confirmDeletePortalooJob(id){const j=data.portalooJobs.find(x=>x.id===id);if(!j)return;releasePortalooJobStock(j,true);data.portalooJobs=data.portalooJobs.filter(x=>x.id!==id);save();closeModal();showPage('portaloo'); if(googleAccessToken)deleteGoogleJob(j).catch(e=>console.error(e))}

let qrAssignMode='';let pendingEquipmentQR='';
function scanExistingQRForEquipment(){
 qrAssignMode='new-equipment';
 const wrap=document.createElement('div');wrap.id='qrScanOverlay';wrap.className='scan-overlay';wrap.innerHTML=`<div class="scan-sheet"><div class="section-head"><div><h2 style="margin:0">📷 Scan existing QR code</h2><div class="muted">Point the camera at the QR code you want to assign to this equipment.</div></div><button class="secondary" onclick="closeQRScanOverlay(event)">Close</button></div><div id="qrScanReader" class="scan-reader"></div><div class="scan-hint">The scanned value will be placed into the Existing QR code field.</div></div>`;
 document.body.appendChild(wrap);
 setTimeout(startExistingQRScan,120);
}
async function startExistingQRScan(){
 stopScan();
 if(!window.Html5Qrcode){alert('QR scanner library is still loading. Try again in a moment.');closeQRScanOverlay();return}
 scanner=new Html5Qrcode('qrScanReader');
 try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:230,height:230}},code=>{pendingEquipmentQR=code;qrAssignMode='';stopScan();closeQRScanOverlay();setTimeout(()=>newItem(pendingEquipmentQR),120)},()=>{});}catch(e){alert('Camera could not start. Please allow camera access.');closeQRScanOverlay();}
}
async function closeQRScanOverlay(evt){if(evt){evt.preventDefault();evt.stopPropagation();}const s=scanner;scanner=null;qrAssignMode='';try{if(s)await s.stop()}catch(e){}try{if(s)await s.clear()}catch(e){}document.getElementById('qrScanOverlay')?.remove();}

function showQR(itemId){const x=data.items.find(i=>i.id===itemId);openModal(`<h2>${esc(x.name)}</h2><p>${esc(x.asset)}</p><div id="qrcode"></div><p class="small">Scan this code to identify the item.</p>`);if(window.QRCode)new QRCode(document.getElementById('qrcode'),{text:'AVT:'+x.id,width:220,height:220});else document.getElementById('qrcode').innerHTML='<p>QR library not loaded.</p>'}
async function startScan(){stopScan();if(!window.Html5Qrcode){alert('QR scanner library is still loading. Try again in a moment.');return}scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},code=>{if(qrAssignMode==='new-equipment'){pendingEquipmentQR=code;qrAssignMode='';stopScan();showPage('create');setTimeout(()=>newItem(pendingEquipmentQR),50);return}let x=null;if(code.startsWith('AVT:'))x=data.items.find(i=>i.id===code.slice(4));if(!x)x=data.items.find(i=>i.qrCode===code);if(x){stopScan();showPage('dashboard');viewItem(x.id)}else if(code){alert('QR scanned, but no equipment is linked to this code yet.');}} ,()=>{})}catch(e){alert('Camera could not start. Please allow camera access.');}}
function stopScan(){if(scanner){scanner.stop().catch(()=>{});scanner.clear().catch(()=>{});scanner=null}}
window.addEventListener('error',e=>console.error('AV Tracker error:',e.message));
setInterval(()=>{if(!document.getElementById('dashboard')?.classList.contains('hidden'))loadDashboardWeather()},600000);
render();
initCloud().then(()=>{if(!loggedIn())setTimeout(showLoginOverlay,250);}).catch(e=>{console.error('Cloud init failed',e);if(!loggedIn())setTimeout(showLoginOverlay,250);});
setTimeout(updateGoogleSyncUI,300);
</script>
