<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AV Tracker">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<title>AV Tracker</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}
header{background:#111827;color:#fff;padding:18px 16px 14px}
h1{font-size:22px;margin:0}.sub{opacity:.7;font-size:12px;margin-top:3px}
main{max-width:760px;margin:auto;padding:14px 14px 100px}
.topnav{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin:10px 0 16px}
button{border:0;border-radius:10px;padding:11px 12px;font-weight:650;background:#111827;color:#fff;font-size:14px;cursor:pointer}
button.secondary{background:#e5e7eb;color:#111827}.danger{background:#b91c1c!important}.green{background:#15803d!important}
.card{background:#fff;border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 1px 4px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.muted{color:#6b7280;font-size:13px}.small{font-size:11px;color:#6b7280}
.badge{padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#dcfce7;color:#166534}
.out{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 10px;font-size:15px}
label{font-size:13px;font-weight:650}.empty{text-align:center;padding:35px 10px;color:#6b7280}
.hidden{display:none!important}
.progress{display:flex;gap:4px;overflow-x:auto;margin:10px 0}.step{padding:6px 8px;border-radius:999px;background:#e5e7eb;color:#4b5563;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer}.step.active{background:#111827;color:#fff}.step.done{background:#dcfce7;color:#166534}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:10000}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(30px + env(safe-area-inset-bottom))}
.close{float:right}
.job-summary{margin-top:12px;border:1px solid #dbe1e8;border-radius:14px;padding:14px;background:#fff}
.job-summary-title{font-size:18px;font-weight:800}.job-summary-sub{font-size:12px;color:#6b7280;margin-top:3px}
.job-progress-track{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:13px 0}
.job-progress-fill{height:100%;background:#16a34a;border-radius:99px}
.stage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stage-box{background:#f3f4f6;border-radius:10px;padding:8px;text-align:center}.stage-num{font-size:18px;font-weight:800}.stage-name{font-size:10px;color:#6b7280}
.detail-stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}.detail-stat{background:#f3f4f6;border-radius:10px;padding:10px}.detail-stat b{display:block;font-size:20px}.detail-stat span{font-size:11px;color:#6b7280}
.pwa-nav{position:fixed;left:0;right:0;bottom:0;z-index:900;background:#111827;border-top:1px solid #374151;display:flex;justify-content:space-around;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}
.pwa-nav button{background:transparent;color:#d1d5db;font-size:11px;padding:7px 8px}.pwa-nav button.active{color:#fff;background:#374151}
@media(min-width:650px){.stage-grid{grid-template-columns:repeat(6,1fr)}.detail-stat-grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<header><h1>🎛️ AV Tracker</h1><div class="sub">Equipment, jobs, QR check-out, van loading & progress</div></header>
<main>
<div class="topnav">
<button onclick="showPage('dashboard')">Dashboard</button>
<button onclick="showPage('equipment')">Equipment</button>
<button onclick="showPage('jobs')">Jobs</button>
<button onclick="showPage('scanner')">📷 Scan</button>
</div>
<section id="dashboard"></section>
<section id="equipment" class="hidden"></section>
<section id="jobs" class="hidden"></section>
<section id="scanner" class="hidden">
<div class="card"><h2>Scan equipment</h2><div id="reader"></div><p class="muted">Allow camera access, then scan an AV Tracker QR code.</p><button class="secondary" onclick="stopScan();showPage('dashboard')">Close scanner</button></div>
</section>
</main>

<nav class="pwa-nav">
<button onclick="showPage('dashboard')">📊<br>Dashboard</button>
<button onclick="showPage('equipment')">📦<br>Equipment</button>
<button onclick="showPage('jobs')">🎪<br>Jobs</button>
<button onclick="showPage('scanner')">📷<br>Scan</button>
<button onclick="managePeople()">👥<br>Crew</button>
</nav>

<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
<div class="sheet" onclick="event.stopPropagation()">
<button class="secondary close" onclick="closeModal()">Close</button>
<div id="modalBody"></div>
</div></div>

<script>
const KEY='avtracker_v1';
let data;
try{data=JSON.parse(localStorage.getItem(KEY)||'{"items":[],"jobs":[],"history":[],"users":[],"vans":[]}')}catch(e){data={items:[],jobs:[],history:[],users:[],vans:[]}}
data.items=data.items||[];data.jobs=data.jobs||[];data.history=data.history||[];data.users=data.users||[];data.vans=data.vans||[];
let scanner=null;
const progressSteps=['Picked','Loaded','Delivered','Setup','On Job','Returned'];
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function v(x){return document.getElementById(x)?.value?.trim()||''}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function makeId(p){return p+'-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,6)}
function userName(id){return (data.users.find(x=>x.id===id)||{}).name||'Unassigned'}
function vanName(id){return (data.vans.find(x=>x.id===id)||{}).name||'Unassigned'}
function currentStep(x){return Math.max(0,progressSteps.indexOf(x.progress||'Picked'))}
function progressBar(x){let n=currentStep(x);return '<div class="progress">'+progressSteps.map((s,i)=>`<span class="step ${i===n?'active':i<n?'done':''}" onclick="setProgress('${x.id}','${s}')">${s}</span>`).join('')+'</div>'}

function showPage(page){
 ['dashboard','equipment','jobs','scanner'].forEach(id=>{
   const el=document.getElementById(id);
   if(el)el.classList.toggle('hidden',id!==page);
 });
 if(page==='scanner')startScan();else stopScan();
 render();
 window.scrollTo({top:0,behavior:'smooth'});
}
function render(){renderDash();renderEquipment();renderJobs()}

function renderDash(){
 const total=data.items.length,avail=data.items.filter(x=>x.status==='Available').length;
 document.getElementById('dashboard').innerHTML=`
 <div class="grid">
  <div class="card"><b>${total}</b><div class="muted">Total items</div></div>
  <div class="card"><b>${avail}</b><div class="muted">Available</div></div>
  <div class="card"><b>${total-avail}</b><div class="muted">Out</div></div>
  <div class="card"><b>${data.jobs.filter(j=>j.status==='Open').length}</b><div class="muted">Open jobs</div></div>
 </div>
 <div class="card"><h2 style="margin-top:0">Quick actions</h2>
 <div class="actions"><button onclick="newItem()">+ Add equipment</button><button class="secondary" onclick="newJob()">+ New job</button><button class="secondary" onclick="showPage('scanner')">📷 Scan QR</button><button class="secondary" onclick="managePeople()">👤 Users</button><button class="secondary" onclick="manageVans()">🚐 Vans</button></div></div>
 <div class="card"><h2>Recent activity</h2>${recent()}</div>`;
}
function recent(){let h=data.history.slice(-8).reverse();return h.length?h.map(x=>`<div style="padding:9px 0;border-bottom:1px solid #eee"><b>${esc(x.itemName)}</b> <span class="muted">${esc(x.action)}</span><br><span class="small">${new Date(x.at).toLocaleString()}${x.job?' • '+esc(x.job):''}</span></div>`).join(''):'<div class="empty">No activity yet.</div>'}

function renderEquipment(){
 const el=document.getElementById('equipment'),q=document.getElementById('eqSearch')?.value||'';
 const items=data.items.filter(x=>(x.name+' '+x.asset+' '+x.category+' '+x.status).toLowerCase().includes(q.toLowerCase()));
 el.innerHTML=`<div class="card"><div class="row"><h2 style="margin:0">Equipment</h2><button onclick="newItem()">+ Add</button></div><input id="eqSearch" placeholder="Search equipment, ID or category" value="${esc(q)}" oninput="renderEquipment()"></div>${items.length?items.map(itemCard).join(''):'<div class="card empty">No equipment yet.<br>Add your first speaker, amp rack, flight case, cable etc.</div>'}`;
}
function itemCard(x){return `<div class="card"><div class="row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.asset)} • ${esc(x.category)}</div></div><span class="badge ${x.status==='Out'?'out':''}">${esc(x.status)}</span></div>${x.job?`<div class="muted">🚚 ${esc(x.job)}</div>`:''}<div class="muted">👤 ${esc(userName(x.userId))} • 🚐 ${esc(vanName(x.vanId))}</div>${x.jobId?progressBar(x):''}<div class="actions"><button onclick="viewItem('${x.id}')">View</button><button class="secondary" onclick="showQR('${x.id}')">QR</button>${x.status==='Out'?`<button class="green" onclick="returnItem('${x.id}')">Return</button>`:`<button class="secondary" onclick="checkout('${x.id}')">Check out</button>`}</div></div>`}

function renderJobs(){
 const el=document.getElementById('jobs');
 if(!data.jobs.length){el.innerHTML='<div class="card empty">No jobs yet.<br>Create a job to start loading equipment.</div>';return}
 el.innerHTML=data.jobs.slice().reverse().map(j=>{
  const items=data.items.filter(i=>i.jobId===j.id),c={Picked:0,Loaded:0,Delivered:0,Setup:0,'On Job':0,Returned:0};
  items.forEach(i=>{if(c[i.progress]!==undefined)c[i.progress]++});
  const total=items.length,pct=total?Math.round((c.Returned||0)/total*100):0;
  return `<div class="job-summary"><div class="row"><div><div class="job-summary-title">${esc(j.name)}</div><div class="job-summary-sub">${esc(j.date||'')} • ${esc(j.status)} • ${total} items</div></div><span class="badge">${pct}% returned</span></div><div class="job-progress-track"><div class="job-progress-fill" style="width:${pct}%"></div></div><div class="stage-grid">${progressSteps.map(s=>`<div class="stage-box"><div class="stage-num">${c[s]||0}</div><div class="stage-name">${s}</div></div>`).join('')}</div><div class="actions"><button onclick="viewJob('${j.id}')">Open Job</button>${j.status==='Open'?`<button class="secondary" onclick="closeJob('${j.id}')">Complete Job</button>`:''}</div></div>`
 }).join('')
}

function openModal(body){document.getElementById('modalBody').innerHTML=body;document.getElementById('modal').classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden')}
function newItem(){openModal(`<h2>Add equipment</h2><label>Name / model</label><input id="f_name" placeholder="JBL PRX812"><label>Asset ID</label><input id="f_asset" placeholder="SPK-001"><label>Category</label><input id="f_cat" placeholder="Speaker"><label>Serial number</label><input id="f_serial"><label>Location</label><input id="f_loc" value="Warehouse"><button onclick="addItem()">Create item</button>`)}
function addItem(){const name=v('f_name');if(!name)return alert('Enter equipment name');const x={id:makeId('item'),name,asset:v('f_asset')||makeId('AV'),category:v('f_cat')||'Equipment',serial:v('f_serial'),location:v('f_loc')||'Warehouse',status:'Available',jobId:null,job:null,userId:'',vanId:'',progress:null};data.items.push(x);data.history.push({itemId:x.id,itemName:x.name,action:'Added',at:new Date().toISOString()});save();closeModal();showPage('equipment')}
function newJob(){openModal(`<h2>New job</h2><label>Job name</label><input id="j_name" placeholder="Festival A"><label>Date</label><input id="j_date" type="date" value="${new Date().toISOString().slice(0,10)}"><button onclick="addJob()">Create job</button>`)}
function addJob(){const name=v('j_name');if(!name)return alert('Enter job name');data.jobs.push({id:makeId('job'),name,date:v('j_date'),status:'Open'});save();closeModal();showPage('jobs')}
function checkout(itemId){const open=data.jobs.filter(j=>j.status==='Open');if(!open.length)return alert('Create an open job first.');openModal(`<h2>Check out</h2><p><b>${esc(data.items.find(x=>x.id===itemId).name)}</b></p><label>Job</label><select id="jobSelect">${open.map(j=>`<option value="${j.id}">${esc(j.name)}</option>`).join('')}</select><label>User</label><select id="co_user"><option value="">Unassigned</option>${data.users.map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select><label>Van</label><select id="co_van"><option value="">Unassigned</option>${data.vans.map(v=>`<option value="${v.id}">${esc(v.name)}</option>`).join('')}</select><label>Progress</label><select id="co_progress">${progressSteps.slice(0,5).map(s=>`<option>${s}</option>`).join('')}</select><button onclick="doCheckout('${itemId}')">Check out</button>`)}
function doCheckout(itemId){const x=data.items.find(i=>i.id===itemId),j=data.jobs.find(j=>j.id===v('jobSelect'));if(!x||!j)return;x.status='Out';x.jobId=j.id;x.job=j.name;x.location=j.name;x.userId=v('co_user');x.vanId=v('co_van');x.progress=v('co_progress')||'Picked';data.history.push({itemId:x.id,itemName:x.name,action:'Checked out',job:j.name,progress:x.progress,at:new Date().toISOString()});save();closeModal();render()}
function setProgress(itemId,step){const x=data.items.find(i=>i.id===itemId);if(!x)return;if(step==='Returned'){returnItem(itemId);return}x.progress=step;save();render()}
function returnItem(itemId){const x=data.items.find(i=>i.id===itemId);if(!x)return;x.status='Available';x.location='Warehouse';x.progress='Returned';x.jobId=null;x.job=null;x.userId='';x.vanId='';data.history.push({itemId:x.id,itemName:x.name,action:'Returned',progress:'Returned',at:new Date().toISOString()});save();render()}
function viewItem(itemId){const x=data.items.find(i=>i.id===itemId);if(!x)return;openModal(`<h2>${esc(x.name)}</h2><p><b>${esc(x.asset)}</b><br>${esc(x.category)}${x.serial?' • S/N '+esc(x.serial):''}</p><p>Status: <b>${esc(x.status)}</b><br>Location: ${esc(x.location)}<br>👤 ${esc(userName(x.userId))}<br>🚐 ${esc(vanName(x.vanId))}</p>${x.jobId?progressBar(x):''}<div class="actions">${x.status==='Out'?`<button class="green" onclick="closeModal();returnItem('${x.id}')">Return</button>`:`<button onclick="closeModal();checkout('${x.id}')">Check out</button>`}</div>`)}
function managePeople(){openModal(`<h2>Users / crew</h2><input id="new_user" placeholder="Crew member name"><button onclick="addUser()">+ Add user</button><div style="margin-top:12px">${data.users.map(u=>`<div class="card">${esc(u.name)} <button class="danger" style="float:right" onclick="deleteUser('${u.id}')">Delete</button></div>`).join('')||'<p class="muted">No users yet.</p>'}</div>`)}
function addUser(){const name=v('new_user');if(!name)return alert('Enter crew member name');data.users.push({id:makeId('user'),name});save();closeModal();render()}
function deleteUser(uid){data.users=data.users.filter(u=>u.id!==uid);data.items.forEach(i=>{if(i.userId===uid)i.userId=''});save();managePeople()}
function manageVans(){openModal(`<h2>Vans</h2><input id="new_van" placeholder="Van 1 / Transit"><button onclick="addVan()">+ Add van</button><div style="margin-top:12px">${data.vans.map(vn=>`<div class="card">${esc(vn.name)} <button class="danger" style="float:right" onclick="deleteVan('${vn.id}')">Delete</button></div>`).join('')||'<p class="muted">No vans yet.</p>'}</div>`)}
function addVan(){const name=v('new_van');if(!name)return alert('Enter van name');data.vans.push({id:makeId('van'),name});save();closeModal();render()}
function deleteVan(vid){data.vans=data.vans.filter(x=>x.id!==vid);data.items.forEach(i=>{if(i.vanId===vid)i.vanId=''});save();manageVans()}
function viewJob(jobId){const j=data.jobs.find(x=>x.id===jobId),items=data.items.filter(x=>x.jobId===jobId);if(!j)return;openModal(`<h2>${esc(j.name)}</h2><p class="muted">${esc(j.date||'')} • ${esc(j.status)}</p>${items.length?items.map(i=>`<div class="card"><b>${esc(i.name)}</b><div class="muted">${esc(i.asset)} • 👤 ${esc(userName(i.userId))} • 🚐 ${esc(vanName(i.vanId))}</div>${progressBar(i)}</div>`).join(''):'<p class="muted">No equipment assigned.</p>'}${j.status==='Open'?`<button onclick="closeJob('${j.id}')">Complete job</button>`:''}`)}
function closeJob(jobId){const n=data.items.filter(i=>i.jobId===jobId).length;if(n)return alert('Return all equipment before completing this job.');const j=data.jobs.find(x=>x.id===jobId);if(j)j.status='Closed';save();closeModal();render()}
function showQR(itemId){const x=data.items.find(i=>i.id===itemId);openModal(`<h2>${esc(x.name)}</h2><p>${esc(x.asset)}</p><div id="qrcode"></div><p class="small">Scan this code to identify the item.</p>`);if(window.QRCode)new QRCode(document.getElementById('qrcode'),{text:'AVT:'+x.id,width:220,height:220});else document.getElementById('qrcode').innerHTML='<p>QR library not loaded.</p>'}
async function startScan(){stopScan();if(!window.Html5Qrcode){alert('QR scanner library is still loading. Try again in a moment.');return}scanner=new Html5Qrcode('reader');try{await scanner.start({facingMode:'environment'},{fps:10,qrbox:{width:220,height:220}},code=>{if(code.startsWith('AVT:')){const x=data.items.find(i=>i.id===code.slice(4));stopScan();showPage('dashboard');if(x)viewItem(x.id);else alert('Item not found')}} ,()=>{})}catch(e){alert('Camera could not start. Please allow camera access.');}}
function stopScan(){if(scanner){scanner.stop().catch(()=>{});scanner.clear().catch(()=>{});scanner=null}}
window.addEventListener('error',e=>console.error('AV Tracker error:',e.message));
render();
</script>
<script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script>
</body></html>
