<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}
header{background:#fff;border-bottom:5px solid var(--regency-green);box-shadow:0 2px 8px #0001;padding:0}.app-header-inner{width:100%;max-width:1100px;margin:auto}.app-header-banner{display:block;width:100%;height:auto;max-height:155px;object-fit:contain;object-position:center;background:#fff}
h1{font-size:22px;margin:0}.sub{opacity:.7;font-size:12px;margin-top:3px}
main{max-width:760px;margin:auto;padding:14px 14px 100px}
.topnav{display:none!important}
button{border:0;border-radius:10px;padding:11px 12px;font-weight:650;background:#111827;color:#fff;font-size:14px;cursor:pointer}
button.secondary{background:#e5e7eb;color:#111827}.danger{background:#b91c1c!important}.green{background:#15803d!important}
.card{background:#fff;border-radius:14px;padding:15px;margin:10px 0;box-shadow:0 1px 4px #0001}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center}
.muted{color:#6b7280;font-size:13px}.small{font-size:11px;color:#6b7280}
.badge{padding:5px 8px;border-radius:999px;font-size:12px;font-weight:700;background:#dcfce7;color:#166534}
.out{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
input,select{width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;margin:5px 0 10px;font-size:15px}
label{font-size:13px;font-weight:650}.empty{text-align:center;padding:35px 10px;color:#6b7280}
.hidden{display:none!important}
.progress{display:flex;gap:4px;overflow-x:auto;margin:10px 0}.step{padding:6px 8px;border-radius:999px;background:#e5e7eb;color:#4b5563;font-size:11px;font-weight:700;white-space:nowrap;cursor:pointer}.step.active{background:#111827;color:#fff}.step.done{background:#dcfce7;color:#166534}
.modal{position:fixed;inset:0;background:#0008;display:flex;align-items:flex-end;z-index:10000}
.sheet{background:#fff;width:100%;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:58px 18px calc(30px + env(safe-area-inset-bottom));position:relative}
.close{position:absolute;right:14px;top:12px;float:none;z-index:3}
.job-summary{margin-top:12px;border:1px solid #dbe1e8;border-radius:14px;padding:14px;background:#fff}
.job-summary-title{font-size:18px;font-weight:800}.job-summary-sub{font-size:12px;color:#6b7280;margin-top:3px}.job-summary.job-complete{opacity:.88}.badge.complete{background:#e5e7eb;color:#374151}.completed-heading{margin:22px 4px 8px}
.job-progress-track{height:12px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:13px 0}
.job-progress-fill{height:100%;background:#16a34a;border-radius:99px}
.stage-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stage-box{background:#f3f4f6;border-radius:10px;padding:8px;text-align:center}.stage-num{font-size:18px;font-weight:800}.stage-name{font-size:10px;color:#6b7280}

.pwa-nav{position:fixed;left:0;right:0;bottom:0;z-index:900;background:#111827;border-top:1px solid #374151;display:flex;justify-content:space-around;padding:7px 5px calc(7px + env(safe-area-inset-bottom))}
.pwa-nav button{background:transparent;color:#d1d5db;font-size:10px;padding:7px 5px;flex:1;min-width:0}.pwa-nav button.active{color:#fff;background:#374151}
.google-sync-card{background:#fff;border:1px solid #dbe1e8;border-radius:14px;padding:14px;margin-top:10px}
.google-sync-status{display:flex;align-items:center;gap:8px;font-size:13px;margin:8px 0}

.nav{display:none!important}

}

  margin:0!important;

}
.pwa-nav{
  padding:10px 5px calc(10px + env(safe-area-inset-bottom))!important;
}
.pwa-nav button{
  min-width:64px!important;
  min-height:58px!important;
  padding:8px 10px!important;
  font-size:13px!important;
}

/* DASHBOARD JOB CALENDAR */
.calendar-wrap{margin-top:12px}

.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border:1px solid var(--regency-border);border-radius:12px;overflow:hidden;background:#fff}

/* V18 REGENCY BLACK + GREEN UI */
:root{
  --regency-green:#008f46;
  --regency-green-dark:#007238;
  --regency-black:#050806;
  --regency-black-2:#0b100d;
  --regency-panel:#101612;
  --regency-panel-2:#151c17;
  --regency-text:#f3f7f4;
  --regency-muted:#aeb9b2;
  --regency-border:#26332b;
  --regency-green-soft:#0b3a25;
}
html,body{background:var(--regency-black)!important;color:var(--regency-text)!important}
body{min-height:100vh}
header{background:var(--regency-black)!important;color:var(--regency-text)!important;border-bottom:4px solid var(--regency-green)!important;box-shadow:0 5px 18px #0008!important;padding:0!important}
.app-header-inner{background:var(--regency-black)!important}
.app-header-banner{display:block;width:100%;height:auto;max-height:190px;object-fit:cover;object-position:center;background:#000!important}
main{background:var(--regency-black)!important}
.card,.job-summary,.google-sync-card,.portaloo-card,.manage-card,.job-doc,.job-equipment-history,.job-summary,.portaloo-service,.portaloo-notes,.detail-stat,.stage-box,.multi-list,.job-assignment>div{background:var(--regency-panel)!important;color:var(--regency-text)!important;border-color:var(--regency-border)!important;box-shadow:0 3px 12px #0006!important}
.card h1,.card h2,.card h3,.card h4,.job-summary-title,.portaloo-title,.manage-row-title,.job-doc-name{color:var(--regency-text)!important}
.muted,.small,.sub,.job-summary-sub,.portaloo-sub,.portaloo-unit span,.portaloo-stat span,.manage-row-meta,.manage-note,.job-doc-meta,.stage-name,.activity-main span,.activity-time{color:var(--regency-muted)!important}
button{background:var(--regency-green)!important;color:#fff!important;border:1px solid #00b95a!important;box-shadow:0 2px 7px #0005}
button:hover{background:var(--regency-green-dark)!important}
button.secondary,.maps-btn{background:var(--regency-panel-2)!important;color:var(--regency-text)!important;border:1px solid var(--regency-border)!important}
button.danger{background:#9f2424!important;border-color:#c73a3a!important}
input,select,textarea{background:#0c120f!important;color:var(--regency-text)!important;border:1px solid #314238!important}

function normalizeStockInventory(){[data.portalooEquipment,data.furnitureProps,data.powerEquipment,data.marqueeEquipment].forEach(arr=>(arr||[]).forEach(x=>{x.totalQty=Math.max(1,Number(x.totalQty)||1);x.allocations=Array.isArray(x.allocations)?x.allocations:[];if(x.jobId&&!x.allocations.some(a=>a.jobId===x.jobId)){x.allocations.push({jobId:x.jobId,qty:1});}if(x.status==='Out'&&!x.allocations.length&&x.totalQty===1)x.allocations.push({jobId:x.jobId||'legacy',qty:1});const used=x.allocations.reduce((n,a)=>n+(Number(a.qty)||0),0);x.availableQty=Math.max(0,x.totalQty-used);x.status=x.availableQty>0?'Available':'Out';x.jobId=x.allocations.length===1?x.allocations[0].jobId:null;}));}
function stockUsed(x){return (x.allocations||[]).reduce((n,a)=>n+(Number(a.qty)||0),0)}
function stockAvailable(x){return Math.max(0,(Number(x.totalQty)||1)-stockUsed(x))}

// Job documents are stored in IndexedDB so PDFs and other files do not consume localStorage quota.
const DOC_DB='avtracker_job_documents_v1';
function openDocsDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB is not available on this device.'));const r=indexedDB.open(DOC_DB,1);r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains('docs'))r.result.createObjectStore('docs',{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('Could not open document storage.'));});}
async function putJobDocument(jobId,file){const db=await openDocsDB();const id=makeId('doc');const record={id,jobId,name:file.name,type:file.type||'application/octet-stream',size:file.size,blob:file,addedAt:new Date().toISOString()};await new Promise((resolve,reject)=>{const tx=db.transaction('docs','readwrite');tx.objectStore('docs').put(record);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Could not save document.'));});db.close();return record;}
async function listJobDocuments(jobId){const db=await openDocsDB();const all=await new Promise((resolve,reject)=>{const r=db.transaction('docs','readonly').objectStore('docs').getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);});db.close();return all.filter(x=>x.jobId===jobId).sort((a,b)=>new Date(a.addedAt)-new Date(b.addedAt));}
async function getJobDocument(docId){const db=await openDocsDB();const rec=await new Promise((resolve,reject)=>{const r=db.transaction('docs','readonly').objectStore('docs').get(docId);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});db.close();return rec;}
async function removeJobDocument(docId){const db=await openDocsDB();await new Promise((resolve,reject)=>{const tx=db.transaction('docs','readwrite');tx.objectStore('docs').delete(docId);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Could not delete document.'));});db.close();}
function formatFileSize(bytes){if(bytes<1024)return bytes+' B';if(bytes<1024*1024)return (bytes/1024).toFixed(1)+' KB';return (bytes/(1024*1024)).toFixed(1)+' MB'}
function docIcon(type,name){const n=(name||'').toLowerCase();if(type==='application/pdf'||n.endsWith('.pdf'))return '📄';if(n.match(/\.(doc|docx)$/))return '📝';if(n.match(/\.(xls|xlsx|csv)$/))return '📊';if(type.startsWith('image/'))return '🖼️';return '📎'}
async function renderJobDocuments(jobId){
 const box=document.getElementById('jobDocumentsList');
 if(!box)return;
 box.innerHTML='<div class="muted">Loading documents…</div>';
 try{
  const docs=await listJobDocuments(jobId);
  if(!docs.length){box.innerHTML='<div class="card empty">No documents attached to this job yet.</div>';return;}
  box.innerHTML='<div class="job-doc-list">'+docs.map(d=>
   '<div class="job-doc"><div class="job-doc-icon">'+docIcon(d.type,d.name)+'</div>'+
   '<div class="job-doc-info"><div class="job-doc-name">'+esc(d.name)+'</div><div class="job-doc-meta">'+formatFileSize(d.size)+' • '+new Date(d.addedAt).toLocaleString()+'</div></div>'+
   '<div class="job-doc-actions"><button class="secondary" onclick="openJobDocument(\''+d.id+'\')">Open</button><button class="danger" onclick="deleteJobDocument(\''+d.id+'\',\''+jobId+'\')">Delete</button></div></div>'
  ).join('')+'</div>';
 }catch(e){box.innerHTML='<div class="muted">Document storage is not available on this device.</div>';}
}
async function uploadJobDocuments(jobId,input){const files=[...(input?.files||[])];if(!files.length)return;const maxBytes=25*1024*1024;let added=0;for(const file of files){if(file.size>maxBytes){alert(`${file.name} is larger than 25 MB and was not added.`);continue;}try{await putJobDocument(jobId,file);added++;}catch(e){alert('Could not save '+file.name+'. Your browser may be out of storage.');break;}}input.value='';await renderJobDocuments(jobId);if(added)renderJobs();}
async function openJobDocument(docId){try{const d=await getJobDocument(docId);if(!d)return;const url=URL.createObjectURL(d.blob);const w=window.open(url,'_blank');if(!w){const a=document.createElement('a');a.href=url;a.download=d.name;a.click();}setTimeout(()=>URL.revokeObjectURL(url),60000);}catch(e){alert('Could not open this document.');}}
async function deleteJobDocument(docId,jobId){if(!confirm('Delete this document from the job?'))return;try{await removeJobDocument(docId);await renderJobDocuments(jobId);}catch(e){alert('Could not delete the document.');}}
async function deleteAllJobDocuments(jobId){try{const docs=await listJobDocuments(jobId);for(const d of docs)await removeJobDocument(d.id);}catch(e){}}
// Health & Safety documents and training videos are stored in IndexedDB so they are separate from app data.
const HS_DB='avtracker_health_safety_docs_v1';
function openHSDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('IndexedDB is not available on this device.'));const r=indexedDB.open(HS_DB,2);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('docs'))db.createObjectStore('docs',{keyPath:'id'});if(!db.objectStoreNames.contains('videos'))db.createObjectStore('videos',{keyPath:'id'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error||new Error('Could not open Health & Safety storage.'));});}
async function putHSDocument(file){const db=await openHSDB();const record={id:makeId('hsdoc'),name:file.name,type:file.type||'application/octet-stream',size:file.size,blob:file,addedAt:new Date().toISOString()};await new Promise((resolve,reject)=>{const tx=db.transaction('docs','readwrite');tx.objectStore('docs').put(record);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Could not save document.'));});db.close();return record;}
async function listHSDocuments(){const db=await openHSDB();const all=await new Promise((resolve,reject)=>{const r=db.transaction('docs','readonly').objectStore('docs').getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);});db.close();return all.sort((a,b)=>{if(!!a.builtIn!==!!b.builtIn)return a.builtIn?-1:1;if(a.builtIn&&b.builtIn)return (a.order||99)-(b.order||99);return new Date(b.addedAt)-new Date(a.addedAt);});}
async function getHSDocument(id){const db=await openHSDB();const rec=await new Promise((resolve,reject)=>{const r=db.transaction('docs','readonly').objectStore('docs').get(id);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error);});db.close();return rec;}
async function removeHSDocument(id){const db=await openHSDB();await new Promise((resolve,reject)=>{const tx=db.transaction('docs','readwrite');tx.objectStore('docs').delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Could not delete document.'));});db.close();}
function formatBytes(n){if(n<1024)return n+' B';if(n<1024*1024)return (n/1024).toFixed(1)+' KB';return (n/1024/1024).toFixed(1)+' MB';}
async function uploadHealthSafetyDocuments(input){const files=[...(input?.files||[])];if(!files.length)return;const maxBytes=25*1024*1024;let added=0;for(const file of files){if(file.size>maxBytes){alert(`${file.name} is larger than 25 MB and was not added.`);continue;}try{await putHSDocument(file);added++;}catch(e){alert('Could not save '+file.name+'. Your browser may be out of storage.');break;}}input.value='';if(added){alert(`${added} document${added===1?'':'s'} uploaded.`);showPage('healthSafety');}}
async function putHSVideoFile(file,title){const db=await openHSDB();const record={id:makeId('hsvideo'),kind:'upload',name:title||file.name,type:file.type||'video/mp4',size:file.size,blob:file,addedAt:new Date().toISOString()};await new Promise((resolve,reject)=>{const tx=db.transaction('videos','readwrite');tx.objectStore('videos').put(record);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Could not save training video.'));});db.close();return record;}
async function putHSYouTube(title,url,videoId){const db=await openHSDB();const record={id:makeId('hsvideo'),kind:'youtube',name:title||'YouTube training video',url,videoId,addedAt:new Date().toISOString()};await new Promise((resolve,reject)=>{const tx=db.transaction('videos','readwrite');tx.objectStore('videos').put(record);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error||new Error('Could not save YouTube video.'));});db.close();return record;}

async function ensureBuiltinUKHSVideos(){
  const db=await openHSDB();
  const existing=await new Promise((resolve,reject)=>{
    const r=db.transaction('videos','readonly').objectStore('videos').getAll();
    r.onsuccess=()=>resolve(r.result||[]);
    r.onerror=()=>reject(r.error);
  });
  const ids=new Set(existing.map(v=>v.id));
  const missing=BUILTIN_UK_HS_VIDEOS.filter(v=>!ids.has(v.id));
  if(missing.length){
    await new Promise((resolve,reject)=>{
      const tx=db.transaction('videos','readwrite');
      const store=tx.objectStore('videos');
      missing.forEach(v=>store.put({...v,addedAt:'2026-10-03T00:00:00.000Z'}));
      tx.oncomplete=resolve;
      tx.onerror=()=>reject(tx.error);
    });
  }
  db.close();
}

async function listHSVideos(){const db=await openHSDB();const all=await new Promise((resolve,reject)=>{const r=db.transaction('videos','readonly').objectStore('videos').getAll();r.onsuccess=()=>resolve(r.result||[]);r.onerror=()=>reject(r.error);});db.close();return all.sort((a,b)=>{if(!!a.builtIn!==!!b.builtIn)return a.builtIn?-1:1;if(a.builtIn&&b.builtIn)return (a.order||99)-(b.order||99);return new Date(b.addedAt)-new Date(a.addedAt);});}

function youtubeVideoId(url){try{const u=new URL(url);if(u.hostname==='youtu.be')return u.pathname.slice(1).split('/')[0];if(u.hostname.endsWith('youtube.com')){if(u.pathname==='/watch')return u.searchParams.get('v');if(u.pathname.startsWith('/shorts/'))return u.pathname.split('/')[2];if(u.pathname.startsWith('/embed/'))return u.pathname.split('/')[2];}}catch(e){}return null;}
async function addYouTubeTrainingVideo(){const url=prompt('Paste the YouTube video URL:');if(!url)return;const videoId=youtubeVideoId(url.trim());if(!videoId){alert('That does not look like a valid YouTube video URL.');return;}const title=prompt('Training video title:','YouTube training video');if(title===null)return;try{await putHSYouTube(title.trim()||'YouTube training video',url.trim(),videoId);renderCreate();}catch(e){alert('Could not save the YouTube video.');}}
async function uploadTrainingVideos(input){const files=[...(input?.files||[])];if(!files.length)return;const maxBytes=250*1024*1024;let added=0;for(const file of files){if(!file.type.startsWith('video/')){alert(`${file.name} is not a video file and was not added.`);continue;}if(file.size>maxBytes){alert(`${file.name} is larger than 250 MB and was not added.`);continue;}const title=prompt('Training video title:',file.name.replace(/\.[^.]+$/,''));if(title===null)continue;try{await putHSVideoFile(file,title.trim()||file.name);added++;}catch(e){alert('Could not save '+file.name+'. Your browser may be out of storage.');break;}}input.value='';if(added)renderCreate();}
async function deleteHSVideo(id){if(!confirm('Remove this training video?'))return;try{await removeHSVideo(id);renderCreate();}catch(e){alert('Could not remove the training video.');}}
function pad2(n){return String(n).padStart(2,'0')}
function dateKeyLocal(d){return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`}
function payPeriodFor(dateStr){const d=new Date(`${dateStr}T12:00:00`);let endYear=d.getFullYear(),endMonth=d.getMonth(),day=d.getDate();if(day<27){endMonth-=1;if(endMonth<0){endMonth=11;endYear--}}const start=new Date(endYear,endMonth,27,12);const end=new Date(endYear,endMonth+1,26,12);return {start:dateKeyLocal(start),end:dateKeyLocal(end),key:dateKeyLocal(start)+'_'+dateKeyLocal(end)}}
function currentPayPeriod(){return payPeriodFor(dateKeyLocal(new Date()))}
function minutesForHourEntry(x){if(x.minutes!=null)return Math.max(0,Number(x.minutes)||0);if(!x.start||!x.finish)return 0;const [sh,sm]=x.start.split(':').map(Number),[fh,fm]=x.finish.split(':').map(Number);let a=sh*60+sm,b=fh*60+fm;if(b<=a)b+=1440;return Math.max(0,b-a)}
function formatHours(mins){const m=Math.max(0,Math.round(Number(mins)||0));return `${Math.floor(m/60)}h ${pad2(m%60)}m`}
function weekBounds(dateStr){const d=new Date(`${dateStr}T12:00:00`);const day=d.getDay()||7;const monday=new Date(d);monday.setDate(d.getDate()-(day-1));const sunday=new Date(monday);sunday.setDate(monday.getDate()+6);return {start:dateKeyLocal(monday),end:dateKeyLocal(sunday)}}
function hourJobOptions(selected,dateStr){const d=dateStr||dateKeyLocal(new Date()),w=weekBounds(d);const jobs=[...(data.events||[])].filter(j=>j.status!=='Closed'&&(((j.startDate||j.date||'')>=w.start&&(j.startDate||j.date||'')<=w.end)||((j.endDate||'')>=w.start&&(j.endDate||'')<=w.end))).map(j=>({id:j.id,label:`🎪 ${j.name}`}));return jobs.map(j=>`<option value="JOB:${esc(j.id)}" ${selected===`JOB:${j.id}`?'selected':''}>${esc(j.label)}</option>`).join('')}
function hourWorkLabel(x){if(x.jobId){const j=(data.events||[]).find(e=>e.id===x.jobId);if(j)return j.name}return x.work||'Other work'}
function wageRateFor(u,type){const w=ensureWageSettings(u)||{};return type==='enhanced1'?Number(w.enhanced1Rate)||Number(w.standardRate)||0:type==='enhanced2'?Number(w.enhanced2Rate)||Number(w.standardRate)||0:Number(w.standardRate)||0}
function hourRateTypeLabel(t){return t==='enhanced1'?'Enhanced Rate 1':t==='enhanced2'?'Enhanced Rate 2':'Standard Rate'}
function hourRateForEntry(x){if(x.rateSnapshot!=null)return Number(x.rateSnapshot)||0;const u=(data.users||[]).find(y=>y.id===x.userId);return wageRateFor(u,x.rateType||'standard')}
function money(n){return `£${Number(n||0).toFixed(2)}`}
function wageForEntry(x){return (minutesForHourEntry(x)/60)*hourRateForEntry(x)}
function paySummary(u,p){const rows=(data.hours||[]).filter(x=>x.userId===u.id&&x.date>=p.start&&x.date<=p.end);const gross=rows.reduce((a,x)=>a+wageForEntry(x),0);const taxPercent=Math.max(0,Math.min(100,Number(ensureWageSettings(u)?.taxPercent)||0));const tax=gross*(taxPercent/100);const overtimeMinutes=rows.filter(x=>x.rateType==='enhanced1'||x.rateType==='enhanced2').reduce((a,x)=>a+minutesForHourEntry(x),0);return {rows,gross,tax,taxPercent,net:Math.max(0,gross-tax),minutes:rows.reduce((a,x)=>a+minutesForHourEntry(x),0),overtimeMinutes}}
function crewAvatarSVG(u,size=42){const c=u?.avatarColor||'#5a341d';return `<svg class="crew-avatar-svg" viewBox="0 0 64 64" width="${size}" height="${size}" aria-hidden="true"><path d="M17 27c0-12 7-20 15-20s15 8 15 20v8H17z" fill="${c}"/><ellipse cx="32" cy="33" rx="17" ry="20" fill="#f1c7a5"/><path d="M15 30c1-13 8-23 17-23 8 0 15 7 17 19-5-5-9-8-16-8-7 0-11 4-18 12z" fill="${c}"/><circle cx="25" cy="33" r="2" fill="#111"/><circle cx="39" cy="33" r="2" fill="#111"/><path d="M23 44c3 6 15 8 19 0-2-1-4-2-5-3h-9c-2 1-3 2-5 3z" fill="${c}"/><path d="M25 40c2 2 12 2 14 0" fill="none" stroke="#8f5f48" stroke-width="2" stroke-linecap="round"/></svg>`}
function holidayUsed(u,excludeId=''){const year=Number(u?.holidayAllowanceYear)||new Date().getFullYear();return (data.hours||[]).filter(x=>x.userId===u.id&&x.work==='Day Off'&&x.id!==excludeId&&String(x.date||'').slice(0,4)===String(year)).length}
function holidayRemaining(u){const allowance=Math.max(0,Math.floor(Number(u?.holidayAllowance)||0));return Math.max(0,allowance-holidayUsed(u))}
function openAvatarPicker(){const u=currentUser();if(!u)return;returnToProfileOnClose=true;const opts=[['#171717','Black'],['#5a341d','Brown'],['#d19a35','Blonde'],['#9a3d26','Red'],['#777777','Grey']];openModal(`<h2>Choose your crew icon</h2><p class="muted">Choose your own hair and beard colour.</p><div class="avatar-picker-grid">${opts.map(([c,label])=>`<button type="button" class="avatar-choice ${u.avatarColor===c?'selected':''}" onclick="selectCrewAvatar('${c}')">${crewAvatarSVG({avatarColor:c})}<span class="avatar-label">${label}</span></button>`).join('')}</div><button class="secondary" onclick="openCrewProfile()">Back to My Profile</button>`)}
function selectCrewAvatar(color){const u=currentUser();if(!u)return;u.avatarColor=color;save();openCrewProfile()}
function openCrewProfile(){const u=currentUser();if(!u)return showLoginOverlay();const p=currentPayPeriod();const sum=paySummary(u,p);const overtime=sum.overtimeMinutes||0;returnToProfileOnClose=false;openModal(`<div class="profile-title-row"><button class="profile-gear" aria-label="Wage setup" title="Wage setup" onclick="openWageSetup()">⚙️</button><button type="button" class="profile-beard-icon" title="Choose crew icon" aria-label="Choose crew icon" onclick="openAvatarPicker()">${crewAvatarSVG(u)}</button><div><h2 style="margin:0">${esc(u.name)}</h2><div class="muted">Personal profile • ${esc(u.role||'Crew')}</div></div></div><div class="profile-grid"><div class="profile-stat"><span>Current Hours</span><b>${formatHours(sum.minutes)}</b></div><div class="profile-stat"><span>Overtime</span><b>${formatHours(overtime)}</b></div><div class="profile-stat"><span>Gross</span><b>${money(sum.gross)}</b></div><div class="profile-stat"><span>Net</span><b>${money(sum.net)}</b></div></div><div class="holiday-counter"><b>🏖️ Holiday Allowance</b><div class="small">${holidayRemaining(u)} day${holidayRemaining(u)===1?'':'s'} remaining of ${Math.max(0,Math.floor(Number(u.holidayAllowance)||0))}</div></div><div class="profile-section"><h3>⏱️ My Hours</h3><div class="actions"><button onclick="openHoursTracker()">View Timesheet</button><button class="secondary" onclick="addHourEntry()">＋ Add Hours</button></div></div>${u.role==='admin'||u.role==='manager'?`<div class="profile-section"><h3>👷 Crew Hours Management</h3><p class="muted">View crew timesheets, approve submissions, set holiday allowance and export Excel.</p><button onclick="openAdminHours()">Open Crew Hours</button></div>`:''}`)}
function openWageSetup(){const u=currentUser();if(!u)return showLoginOverlay();const w=ensureWageSettings(u);returnToProfileOnClose=true;openModal(`<h2>⚙️ Wage Setup</h2><p class="muted">Set the three hourly rates and the tax percentage used for the 27th → 26th pay period.</p><label>Standard Rate (£/hour)</label><input id="w_standard" type="number" min="0" step="0.01" value="${w.standardRate.toFixed(2)}"><label>Enhanced Rate 1 (£/hour)</label><input id="w_enh1" type="number" min="0" step="0.01" value="${w.enhanced1Rate.toFixed(2)}"><label>Enhanced Rate 2 (£/hour)</label><input id="w_enh2" type="number" min="0" step="0.01" value="${w.enhanced2Rate.toFixed(2)}"><label>Tax deduction (%)</label><input id="w_tax" type="number" min="0" max="100" step="0.01" value="${w.taxPercent.toFixed(2)}"><p class="small muted">Tax is calculated as a percentage of gross pay for the current pay period.</p><button onclick="saveWageSetup()">Save Wage Setup</button>`)}

function saveWageSetup(){const u=currentUser();if(!u)return;const std=Math.max(0,Number(v('w_standard'))||0),e1=Math.max(0,Number(v('w_enh1'))||0),e2=Math.max(0,Number(v('w_enh2'))||0),tax=Math.max(0,Math.min(100,Number(v('w_tax'))||0));if(!std||!e1||!e2)return alert('Enter all three hourly rates.');u.wageSettings={standardRate:std,enhanced1Rate:e1,enhanced2Rate:e2,taxPercent:tax};save();returnToProfileOnClose=false;closeModal();openCrewProfile()}
function toggleHourEntryMode(){const day=v('h_job')==='OTHER:dayoff';const rate=document.getElementById('h_rate_wrap'),times=document.getElementById('h_time_wrap'),note=document.getElementById('h_dayoff_note');if(rate)rate.style.display=day?'none':'';if(times)times.style.display=day?'none':'';if(note)note.style.display=day?'block':'none'}

iday Allowance. You have <b>${holidayRemaining(u)+(x?.work==='Day Off'?1:0)}</b> day${(holidayRemaining(u)+(x?.work==='Day Off'?1:0))===1?'':'s'} remaining.</div><p class="small muted">Hours are recorded only. Breaks are paid. No location tracking.</p><button onclick="saveHourEntry('${x?.id||''}')">Save hours</button>`);toggleHourEntryMode()}
function saveHourEntry(id){const u=currentUser();if(!u)return;const date=v('h_date'),sel=v('h_job');if(!date||!sel)return alert('Select a date and job/work type.');const existing=id?data.hours.find(h=>h.id===id):null;const isDayOff=sel==='OTHER:dayoff';let start='',finish='',minutes=0,rateType='standard',jobId='',work='';if(isDayOff){if(existing?.work!=='Day Off'&&holidayRemaining(u)<=0)return alert('You have no Holiday Allowance days remaining. Ask an admin to add more.');work='Day Off';}else{start=v('h_start');finish=v('h_finish');if(!start||!finish)return alert('Enter start and finish times.');minutes=minutesForHourEntry({start,finish});if(minutes<=0)return alert('Finish time must be after start time.');rateType=v('h_rate')||'standard';if(sel.startsWith('JOB:'))jobId=sel.slice(4);else work=({warehouse:'Warehouse',portaloo:'Portaloo Service',sick:'Sick Day'}[sel.slice(6)]||'Other work');}const x={id:id||makeId('hours'),userId:u.id,date,start,finish,minutes,jobId,work,rateType,rateSnapshot:wageRateFor(u,rateType),status:(existing?.status)||'Draft',createdAt:existing?.createdAt||new Date().toISOString()};if(id){const i=data.hours.findIndex(h=>h.id===id);if(i>=0)data.hours[i]=x}else data.hours.push(x);save();returnToProfileOnClose=false;closeModal();openHoursTracker()}

function renderTimesheetPeriod(u,p,isPrevious=false){
 const rows=(data.hours||[]).filter(x=>x.userId===u.id&&x.date>=p.start&&x.date<=p.end).slice().sort((a,b)=>(a.date+a.start).localeCompare(b.date+b.start));
 const sum=paySummary(u,p),submitted=rows.length&&rows.every(x=>x.status==='Submitted'),days={};
 rows.forEach(x=>(days[x.date]||(days[x.date]=[])).push(x));
 const dayBlocks=Object.entries(days).map(([date,rs])=>{
   const entries=rs.map(x=>{
     const edit=x.status!=='Submitted'?`<button class="secondary timesheet-edit" onclick="addHourEntry('${x.id}')">Edit</button>`:'';
     const main=x.work==='Day Off'?'<b>🏖️ Day Off</b>':`<b>${esc(x.start)} <span class="time-arrow">→</span> ${esc(x.finish)}</b>`;

     const amount=x.work==='Day Off'?'':`<div>${formatHours(minutesForHourEntry(x))}</div><div class="small">${money(wageForEntry(x))}</div>`;
     return `<div class="timesheet-entry"><div class="timesheet-entry-main">${main}<div class="small">${sub}</div></div><div class="timesheet-entry-hours">${amount}</div>${edit}</div>`;
   }).join('');
   return `<div class="timesheet-day"><div class="timesheet-day-head"><div><b>${new Date(date+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short',day:'2-digit',month:'long',year:'numeric'})}</b></div></div>${entries}</div>`;
 }).join('');
 const submitBlock=!isPrevious&&rows.length&&!submitted?`<div class="timesheet-submit"><button class="green" style="width:100%" onclick="submitHoursPeriod()">Submit Pay Period</button><div class="small muted">Once submitted, you will not be able to amend these hours.</div></div>`:'';
 const prev=previousSubmittedPeriods(u,p.key);
 const previousBlock=!isPrevious&&prev.length?`<div class="profile-section"><h3>Previous Submitted Timesheets</h3>${prev.map(q=>`<div class="admin-hours-row"><div><b>${q.start.slice(8,10)}/${q.start.slice(5,7)}/${q.start.slice(0,4)} → ${q.end.slice(8,10)}/${q.end.slice(5,7)}/${q.end.slice(0,4)}</b><div class="small">Submitted • ${formatHours(paySummary(u,q).minutes)}</div></div><button class="secondary" onclick="openTimesheetPeriod('${q.key}')">View</button></div>`).join('')}</div>`:'';
 const addBlock=!isPrevious?`<div class="actions timesheet-top-actions"><button onclick="addHourEntry()">＋ Add Hours</button></div>`:`<div class="actions timesheet-top-actions"><button class="secondary" onclick="openHoursTracker()">← Current Pay Period</button></div>`;
 openModal(`<div class="timesheet-header"><div><h2 style="margin:0">⏱️ My Timesheet</h2><div class="muted">${p.start.slice(8,10)}/${p.start.slice(5,7)}/${p.start.slice(0,4)} → ${p.end.slice(8,10)}/${p.end.slice(5,7)}/${p.end.slice(0,4)}</div></div><span class="period-pill">${isPrevious?'SUBMITTED':submitted?'SUBMITTED':'DRAFT'}</span></div><div class="timesheet-total-grid"><div class="profile-stat"><span>Total Hours</span><b>${formatHours(sum.minutes)}</b></div><div class="profile-stat"><span>Overtime</span><b>${formatHours(sum.overtimeMinutes||0)}</b></div><div class="profile-stat"><span>Gross</span><b>${money(sum.gross)}</b></div><div class="profile-stat"><span>Net</span><b>${money(sum.net)}</b></div></div>${addBlock}<div class="timesheet-list">${dayBlocks||'<div class="empty">No hours recorded for this pay period.</div>'}</div>${submitBlock}${previousBlock}`);

function exportHoursExcel(uid){const p=currentPayPeriod();const people=uid?[data.users.find(u=>u.id===uid)].filter(Boolean):data.users.filter(u=>!u.cloudOnly);const rows=[];people.forEach(c=>(data.hours||[]).filter(x=>x.userId===c.id&&x.date>=p.start&&x.date<=p.end).forEach(x=>rows.push({Crew:c.name,Date:x.date,Work:hourWorkLabel(x),RateType:hourRateTypeLabel(x.rateType||'standard'),Rate:Number(hourRateForEntry(x).toFixed(2)),Start:x.start,Finish:x.finish,'Hours':Number((minutesForHourEntry(x)/60).toFixed(2)),Gross:Number(wageForEntry(x).toFixed(2)),Status:x.status})));if(!rows.length)return alert('No hours to export for this pay period.');if(window.XLSX){const ws=XLSX.utils.json_to_sheet(rows);const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Timesheet');XLSX.writeFile(wb,`Regency_Timesheet_${p.start}_to_${p.end}.xlsx`);}else{const csv=[Object.keys(rows[0]).join(','),...rows.map(r=>Object.values(r).map(v=>`"${String(v).replaceAll('"','""')}"`).join(','))].join('\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=`Regency_Timesheet_${p.start}_to_${p.end}.csv`;a.click();}}

async function photoFromInput(id){
 const file=document.getElementById(id)?.files?.[0];if(!file)return '';
 return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const max=900,scale=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*scale);c.height=Math.round(im.height*scale);c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.72))};im.onerror=reject;im.src=r.result};r.onerror=reject;r.readAsDataURL(file)});
}

function calendarDateKey(d){
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function calendarParseDate(s){
  if(!s)return null;
  const p=String(s).split('-').map(Number);
  if(p.length!==3||!p[0]||!p[1]||!p[2])return null;
  return new Date(p[0],p[1]-1,p[2]);
}

function googleJobEvent(j,type){

  if(j.status==='Complete')title+=' | COMPLETE';
  const desc=[`Regency Events ${isPortaloo?'Portaloo':isMarquee?'Marquee':'AV'} Job`,`Status: ${j.status||''}`];
  if(isPortaloo){
    if(j.what3words)desc.push(`What3words: ${j.what3words}`);

    if(j.customer?.email)desc.push(`Email: ${j.customer.email}`);
    if(j.rolling)desc.push('Schedule: Rolling / no fixed end date');
    if(j.notes)desc.push(`Notes: ${j.notes}`);
    const crew=(j.userIds||[]).map(userName).filter(Boolean);
    if(crew.length)desc.push(`Crew: ${crew.join(', ')}`);
    desc.push(`Units: Mondo ${Number(j.unit1)||0}, Maxim 3000 ${Number(j.unit2)||0}, Tuffway ${Number(j.unit3)||0}`);
  }else if(isMarquee){
    if(j.what3words)desc.push(`What3words: ${j.what3words}`);
    if(j.size)desc.push(`Marquee / structure: ${j.size}`);
    if(j.notes)desc.push(`Notes: ${j.notes}`);
    const crew=(j.userIds||[]).map(userName).filter(Boolean);if(crew.length)desc.push(`Crew: ${crew.join(', ')}`);
    const vans=(j.vanIds||[]).map(vanName).filter(Boolean);if(vans.length)desc.push(`Vans: ${vans.join(', ')}`);
  }else{
    if(j.what3words)desc.push(`What3words: ${j.what3words}`);
    const crew=(j.userIds||[]).map(userName).filter(Boolean);
    if(crew.length)desc.push(`Crew: ${crew.join(', ')}`);
    const vans=(j.vanIds||[]).map(vanName).filter(Boolean);

function googleDatePlusOne(dateStr){
  const d=new Date(String(dateStr)+'T00:00:00'); d.setDate(d.getDate()+1);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
async function googleApi(path,options={}){
  if(!googleAccessToken)throw new Error('Google Calendar is not connected.');
  const headers=Object.assign({'Authorization':'Bearer '+googleAccessToken,'Content-Type':'application/json'},options.headers||{});
  const r=await fetch('https://www.googleapis.com/calendar/v3'+path,Object.assign({},options,{headers}));
  if(!r.ok){
    let msg=''; try{const e=await r.json();msg=e.error?.message||'';}catch(_){}
    if(r.status===401){googleAccessToken='';updateGoogleSyncUI();throw new Error('Google authorization expired. Please reconnect Google Calendar.');}
    throw new Error(msg||`Google Calendar error ${r.status}`);
  }
  if(r.status===204)return null;
  return r.json();
}

      callback:async response=>{
        googleBusy=false;
        if(response.error){alert('Google Calendar authorization was not completed.');return;}

  }catch(e){googleBusy=false;alert(e.message||'Could not connect Google Calendar.');}
}

function renderDashboardCalendar(){
  const box=document.getElementById('dashboardCalendar');
  if(!box)return;
  const y=calendarMonth.getFullYear(),m=calendarMonth.getMonth();
  const first=new Date(y,m,1),last=new Date(y,m+1,0);
  const startOffset=first.getDay();
  const totalCells=Math.ceil((startOffset+last.getDate())/7)*7;
  const todayKey=calendarDateKey(new Date());
  const monthName=calendarMonth.toLocaleDateString(undefined,{month:'long',year:'numeric'});
  const weekdays=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let cells=weekdays.map(x=>`<div class="calendar-weekday">${x}</div>`).join('');
  for(let i=0;i<totalCells;i++){
    const day=new Date(y,m,1-startOffset+i),key=calendarDateKey(day);
    const events=calendarEventForDay(day);
    const other=day.getMonth()!==m?' other-month':'';
    const today=key===todayKey?' today':'';
    let eventHtml=events.slice(0,3).map(e=>`<button class="calendar-event ${e.type} ${e.status==='Complete'?'complete':''}" onclick="openCalendarEvent('${e.type}','${e.id}')">${esc(e.name)}</button>`).join('');
    if(events.length>3)eventHtml+=`<div class="calendar-more">+${events.length-3} more</div>`;
    cells+=`<div class="calendar-day${other}${today}"><div class="calendar-day-num">${day.getDate()}</div><div class="calendar-events">${eventHtml}</div></div>`;
  }
  box.innerHTML=`
    <div class="calendar-toolbar">
      <h2>Job Calendar</h2>
      <div class="cal-actions">
        <button class="secondary" onclick="changeCalendarMonth(-1)">‹</button>
        <button class="secondary" onclick="resetCalendarMonth()">Today</button>
        <button class="secondary" onclick="changeCalendarMonth(1)">›</button>
      </div>
    </div>
    <div class="calendar-wrap">
      <div class="muted" style="margin-bottom:8px;font-weight:700">${monthName}</div>
      <div class="calendar-grid">${cells}</div>
      <div class="calendar-legend">
        <span><i class="calendar-dot av"></i> AV Job</span>
        <span><i class="calendar-dot portaloo"></i> Portaloo Job</span>
        <span><i class="calendar-dot marquee"></i> Marquee Job</span>
        <span>Tap a job to open it</span>
      </div>
    </div>`;
}

function jobProgressBar(j){
 const n=Math.max(0,progressSteps.indexOf(j.progress||'Picked'));
 return '<div class="progress job-stage-progress">'+progressSteps.map((s,i)=>
   `<span class="step ${i===n?'active':i<n?'done':''}" onclick="setJobProgress('${j.id}','${s}')">${s}</span>`
 ).join('')+'</div>';
}

function renderJobs(){
 const el=document.getElementById('jobs');
 const head=`<div class="card"><div class="section-head"><h2>Jobs</h2><button onclick="newJob()">＋ Create job</button></div><div class="muted">Build manifests, assign crew and vans, and track the whole job.</div></div>`;
 if(!data.jobs.length){el.innerHTML=head+'<div class="card empty">No jobs yet.<br>Tap <b>Create job</b> to get started.</div>';return;}
 const active=data.jobs.filter(j=>j.status!=='Complete').slice().reverse();
 const completed=data.jobs.filter(j=>j.status==='Complete').slice().reverse();
 const card=j=>{
   const items=data.items.filter(i=>i.jobId===j.id),total=items.length;
   const isComplete=j.status==='Complete';
   const history=j.equipmentHistory||[];
   const used=[]; const seen=new Set();
   history.forEach(run=>(run.items||[]).forEach(i=>{const key=i.id||i.asset||i.name;if(!seen.has(key)){seen.add(key);used.push(i)}}));
   const historyHtml=used.length?`<div class="job-equipment-history"><div class="job-equipment-history-title">Equipment used on this job</div>${used.map(i=>`<div class="job-equipment-history-item"><b>${esc(i.name)}</b></div>`).join('')}</div>`:'';
   return `<div class="job-summary ${isComplete?'job-complete':''}"><div class="row">${photoHtml(j.photo)}<div style="flex:1"><div class="job-summary-title">${esc(j.name)}</div><div class="job-summary-sub">${esc(j.date||'')} • ${esc(j.status)} • ${isComplete?used.length+' item'+(used.length===1?'':'s')+' used':total+' item'+(total===1?'':'s')+' currently attached'}</div></div><span class="badge ${isComplete?'complete':''}">${esc(j.status)}</span></div><div class="job-assignment"><div><span class="small">CREW</span><br><b>👤 ${esc(jobCrewText(j))}</b></div><div><span class="small">VANS</span><br><b>🚐 ${esc(jobVanText(j))}</b></div></div>${j.what3words?`<div class="muted">📍 ${esc(j.what3words)}</div>`:''}${historyHtml}<div class="actions"><button onclick="viewJob('${j.id}')">Open Job</button>${isComplete?`<button class="secondary" onclick="reopenJob('${j.id}')">Reopen Job</button>`:`<button class="green" onclick="completeJob('${j.id}')">Complete Job</button>`}<button class="danger" onclick="deleteJob('${j.id}')">Delete Job</button></div></div>`;
 };
 let html=head;
 if(active.length)html+=active.map(card).join('');
 if(completed.length)html+=`<div class="completed-heading"><h2>Completed Jobs</h2><div class="muted">Completed jobs are kept here for reference and can be reopened if needed.</div></div>`+completed.map(card).join('');
 el.innerHTML=html;
}

function setJobProgress(jobId,step){
 const j=data.jobs.find(x=>x.id===jobId);
 if(!j)return;
 j.progress=step;
 logActivity({itemName:j.name,action:'Job progress changed',job:j.name,progress:step,at:new Date().toISOString()});
 save();
 render();
}

 const open=data.jobs.filter(j=>j.status==='Open');
 if(!open.length)return alert('Create an open job first.');
 openModal(`<h2>Add to job</h2>
 <p><b>${esc(data.items.find(x=>x.id===itemId).name)}</b></p>
 <label>Job</label><select id="jobSelect">${open.map(j=>`<option value="${j.id}">${esc(j.name)}</option>`).join('')}</select>
 <button onclick="doCheckout('${itemId}')">Add to job</button>`);

function doCheckout(itemId){
 const x=data.items.find(i=>i.id===itemId),j=data.jobs.find(j=>j.id===v('jobSelect'));
 if(!x||!j)return;
 x.status='Out';x.jobId=j.id;x.job=j.name;x.location=j.name;x.progress=null;x.userId='';x.vanId='';
 logActivity({itemId:x.id,itemName:x.name,action:'Added to job',job:j.name,at:new Date().toISOString()});

}

function addItemsToJob(jobId){
 const j=data.jobs.find(x=>x.id===jobId);
 if(!j||j.status!=='Open')return alert('This job is closed.');
 const available=data.items.filter(x=>x.status==='Available'&&!x.jobId);
 if(!available.length)return alert('No available equipment. Add equipment first, or return equipment from another job.');
 openModal(`<h2>Add equipment to ${esc(j.name)}</h2><p class="muted">Select one or more items. They will start at <b>Picked</b>.</p><input id="jobItemSearch" placeholder="Search equipment or asset ID" oninput="filterJobItems()"><label style="display:flex;align-items:center;gap:8px;margin:8px 0;font-size:13px"><input id="selectAllJobItems" type="checkbox" style="width:20px;height:20px;margin:0" onchange="toggleAllJobItems(this.checked)"> Select all visible</label><div id="jobItemList">${jobItemListHtml(available)}</div><button onclick="assignSelectedItems('${j.id}')">Add selected equipment</button>`);
}
function jobItemListHtml(items){
 if(!items.length)return '<p class="muted">No matching equipment.</p>';
 return items.map(x=>`<label style="display:flex;align-items:center;gap:10px;background:#f3f4f6;padding:11px;border-radius:10px;margin:6px 0;cursor:pointer"><input class="job-item-check" type="checkbox" value="${x.id}" style="width:20px;height:20px;margin:0"><span><b>${esc(x.name)}</b><br><span class="small">${esc(x.asset)} • ${esc(x.category)}</span></span></label>`).join('');
}
function filterJobItems(){
 const q=(document.getElementById('jobItemSearch')?.value||'').toLowerCase();
 const items=data.items.filter(x=>x.status==='Available'&&!x.jobId&&(x.name+' '+x.asset+' '+x.category).toLowerCase().includes(q));
 const el=document.getElementById('jobItemList');if(el)el.innerHTML=jobItemListHtml(items);
}
function toggleAllJobItems(checked){document.querySelectorAll('.job-item-check').forEach(x=>x.checked=checked)}
function assignSelectedItems(jobId){
 const j=data.jobs.find(x=>x.id===jobId);if(!j)return;
 const checks=[...document.querySelectorAll('.job-item-check:checked')];
 if(!checks.length)return alert('Select at least one item.');
 let count=0;
 checks.forEach(ch=>{
  const x=data.items.find(i=>i.id===ch.value);
  if(!x||x.status!=='Available'||x.jobId)return;
  x.status='Out';x.jobId=j.id;x.job=j.name;x.location=j.name;x.progress=null;x.userId='';x.vanId='';
  logActivity({itemId:x.id,itemName:x.name,action:'Added to job',job:j.name,progress:'Picked',at:new Date().toISOString()});count++;
 });
 save();closeModal();render();
}
function removeFromJob(itemId){
 const x=data.items.find(i=>i.id===itemId);if(!x||!x.jobId)return;
 const job=x.job;
 x.status='Available';x.location='Warehouse';x.jobId=null;x.job=null;x.progress=null;x.userId='';x.vanId='';
 logActivity({itemId:x.id,itemName:x.name,action:'Removed from job',job:job,at:new Date().toISOString()});
 save();closeModal();render();
}
function completeJob(jobId){
 const j=data.jobs.find(x=>x.id===jobId);if(!j)return;
 const attached=data.items.filter(x=>x.jobId===jobId);
 const n=attached.length;
 openModal(`<h2>Complete job?</h2><p>Are you sure you want to mark <b>${esc(j.name)}</b> as complete?</p>${n?`<p><b>${n}</b> piece${n===1?'':'s'} of equipment will be returned to the warehouse.</p><p class="muted">The equipment will remain recorded in the job's history so you can see exactly what was used.</p>`:'<p class="muted">There is no equipment currently attached to this job.</p>'}<div class="actions" style="margin-top:16px"><button class="secondary" onclick="closeModal()">Cancel</button><button class="green" onclick="confirmCompleteJob('${j.id}')">Yes, complete job</button></div>`);
}
function confirmCompleteJob(jobId){
 const j=data.jobs.find(x=>x.id===jobId);if(!j)return;
 const attached=data.items.filter(x=>x.jobId===jobId);
 if(!j.equipmentHistory)j.equipmentHistory=[];
 if(attached.length){
   j.equipmentHistory.push({completedAt:new Date().toISOString(),items:attached.map(x=>({id:x.id,name:x.name,asset:x.asset,category:x.category,serial:x.serial}))});
 }
 attached.forEach(x=>{
   x.status='Available';x.location='Warehouse';x.jobId=null;x.job=null;x.progress='Returned';x.userId='';x.vanId='';
   logActivity({itemId:x.id,itemName:x.name,action:'Returned on job completion',job:j.name,progress:'Returned',at:new Date().toISOString()});
 });
 j.status='Complete';j.progress='Returned';j.completedAt=new Date().toISOString();
 logActivity({itemName:j.name,action:'Job completed',job:j.name,at:new Date().toISOString()});
 save();closeModal();render();
 if(googleAccessToken)syncGoogleJob(j,'av').catch(e=>console.error(e));
}
function reopenJob(jobId){
 const j=data.jobs.find(x=>x.id===jobId);if(!j)return;
 j.status='Open';
 logActivity({itemName:j.name,action:'Job reopened',job:j.name,at:new Date().toISOString()});
 save();render();
 if(googleAccessToken)syncGoogleJob(j,'av').catch(e=>console.error(e));
}

 if(!j)return;

 openModal(`<h2>Delete job?</h2>
   <p>Are you sure you want to delete <b>${esc(j.name)}</b>?</p>
   ${items.length?`<p class="muted"><b>${items.length}</b> piece${items.length===1?'':'s'} of equipment are still attached to this job. They will be returned to <b>Available / Warehouse</b>.</p>`:'<p class="muted">This job has no equipment attached.</p>'}
   <div class="actions" style="margin-top:16px">
    <button class="secondary" onclick="closeModal()">Cancel</button>
    <button class="danger" onclick="confirmDeleteJob('${j.id}')">Yes, delete job</button>
   </div>`);
}
function confirmDeleteJob(jobId){
 const j=data.jobs.find(x=>x.id===jobId);
 if(!j)return;
 const attached=data.items.filter(i=>i.jobId===jobId);
 attached.forEach(x=>{

function eventCrewText(e){const a=(e.userIds||[]).map(userName).filter(x=>x!=='Unassigned');return a.length?a.join(', '):'Unassigned';}
function eventVanText(e){const a=(e.vanIds||[]).map(vanName).filter(x=>x!=='Unassigned');return a.length?a.join(', '):'Unassigned';}
function eventStatusClass(status){return String(status||'').toLowerCase().replace(/[^a-z]+/g,'-').replace(/^-|-$/g,'')||'not-started'}
function eventStatusBadge(status){const s=String(status||'Not Started');return `<span class="badge event-status-badge status-${eventStatusClass(s)}">${esc(s)}</span>`}
function eventStatusFillClass(status){return `event-progress-fill status-${eventStatusClass(status)}`}

function eventSectionLabel(k){return {marquee:'⛺ Marquee',portaloo:"<img class='portaloo-icon' src='portaloo-icon.svg' alt=''> Portaloo's & Toilet Trailers",power:'⚡ Power & Distro',furniture:'🪑 Furniture & Props'}[k]||k;}
function toggleClosedEventJobs(){data.settings.showClosedEventJobs=data.settings.showClosedEventJobs===false;save();renderEvents()}
function renderEvents(){const el=document.getElementById('events');if(!el)return;refreshAllEventStatuses();const jobs=(data.events||[]).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));const active=jobs.filter(j=>j.status!=='Closed'),completed=jobs.filter(j=>j.status==='Closed');const card=j=>{const sections=Object.entries(j.sections||{}).filter(([k,v])=>k!=='av'&&v&&v.length).map(([k,v])=>`<span class="badge">${eventSectionLabel(k)}</span>`).join('');const past=j.date&&j.date<new Date().toISOString().slice(0,10);return `<div class="job-summary ${j.status==='Closed'?'job-complete':''}"><div class="row"><div style="flex:1"><div class="job-summary-title">${esc(j.name)}</div><div class="job-summary-sub">${esc(j.date||'')} • ${esc(j.status)}</div></div>${eventStatusBadge(j.status)}</div>${sections?`<div class="event-section-tags">${sections}</div>`:'<div class="muted">No service sections added yet</div>'}<div class="job-summary-status muted">${past?'📅 Event date passed':'📅 Event date '+(j.date||'not set')}</div><div class="job-assignment"><div><span class="small">CREW</span><br><b>🧔 ${esc(eventCrewText(j))}</b></div><div><span class="small">VANS</span><br><b>🚐 ${esc(eventVanText(j))}</b></div></div><div class="muted">📍 ${esc(j.what3words||'No What3words location')}</div>${j.what3words?`<div class="actions"><button class="maps-btn" onclick="openWhat3WordsForValue('${esc(j.what3words)}')">📍 What3words</button><button class="secondary" onclick="openWhat3WordsAppForValue('${esc(j.what3words)}')">🔎 Find</button></div>`:''}<div class="actions"><button onclick="viewEventJob('${j.id}')">Open Build Sheet</button>${j.status==='Closed'?`<button class="secondary" onclick="reopenEventJob('${j.id}')">Reopen</button>`:''}</div></div>`};let html=`<div class="card"><div class="section-head"><div><h2>Event Jobs</h2><div class="muted">One job build sheet for the whole event.</div></div><button onclick="newEventJob()">＋ Create job</button></div></div>`;html+=active.length?active.map(card).join(''):'<div class="card empty">No active event jobs.</div>';if(completed.length)html+=`<div class="completed-heading"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px"><h2 style="margin:0">Closed Jobs</h2><button class="secondary closed-toggle-btn" onclick="toggleClosedEventJobs()">${data.settings.showClosedEventJobs===false?'Show':'Hide'}</button></div><div class="muted">Closed jobs stay here for reference and can be reopened.</div></div>${data.settings.showClosedEventJobs!==false?completed.map(card).join(''):''}`;el.innerHTML=html;}
function eventSectionItems(e,k){return (e.sections&&e.sections[k])||[];}
function eventCategoryKeys(e){const keys=[];if((e.sections?.marquee||[]).length)keys.push('marquee');if((e.sections?.portaloo||[]).length)keys.push('portaloo');if((e.sections?.power||[]).length)keys.push('power');if((e.sections?.furniture||[]).length)keys.push('furniture');if(data.items.some(x=>x.jobId===e.avJobId))keys.push('av');return [...new Set(keys)];}
function eventCategoryLabel(k){return k==='av'?'🔊 AV Equipment':eventSectionLabel(k)}
function eventCategoryStatus(e,k){return e.categoryStatuses?.[k]||'Not Started'}
function inventoryForEventLine(line){if(!line?.inventoryId)return null;const type=line.inventoryType;const arr=type==='portaloo'?data.portalooEquipment:type==='furniture'?data.furnitureProps:type==='power'?data.powerEquipment:type==='marquee'?data.marqueeEquipment:null;return arr?.find(x=>x.id===line.inventoryId)||null}
function returnEventJobToStock(e){if(!e)return;if(!Array.isArray(e.equipmentHistory))e.equipmentHistory=[];const attached=data.items.filter(x=>x.jobId===e.avJobId);attached.forEach(x=>{if(!e.equipmentHistory.some(h=>h.id===x.id))e.equipmentHistory.push({id:x.id,name:x.name,asset:x.asset||'',photo:x.photo||''});x.status='Available';x.location='Warehouse';x.progress='Returned';x.jobId=null;x.job=null;x.userId='';x.vanId='';logActivity({itemId:x.id,itemName:x.name,action:'Returned from event job',job:e.name,progress:'Returned',at:new Date().toISOString()});});Object.keys(e.sections||{}).forEach(k=>(e.sections[k]||[]).forEach(line=>{const inv=inventoryForEventLine(line);if(inv&&stockUsedForJob(inv,e.id)>0)releaseStock(inv,e.id,Number(line.qty)||1);}));e.categoryStatuses=e.categoryStatuses||{};eventCategoryKeys(e).forEach(k=>e.categoryStatuses[k]='Returned');e.status='Closed';e.progress='Closed';e.completedAt=e.completedAt||new Date().toISOString();const j=data.jobs.find(x=>x.id===e.avJobId);if(j){j.status='Complete';j.progress='Returned';j.completedAt=e.completedAt;}}
function refreshEventOverallStatus(e){if(e.status==='Closed')return 'Closed';if(e.status==='Complete'&&!e.categoryStatuses){e.status='Complete';return 'Complete'}const keys=eventCategoryKeys(e);e.categoryStatuses=e.categoryStatuses||{};keys.forEach(k=>{if(!e.categoryStatuses[k])e.categoryStatuses[k]='Not Started'});Object.keys(e.categoryStatuses).forEach(k=>{if(!keys.includes(k))delete e.categoryStatuses[k]});const today=new Date().toISOString().slice(0,10);const past=!!e.date&&e.date<today;let overall='Not Started';if(keys.length){const vals=keys.map(k=>eventCategoryStatus(e,k));if(past){overall=vals.every(v=>v==='Returned')?'Closed':'Complete';}else if(vals.every(v=>v==='Setup'||v==='Returned'))overall='Setup';else if(vals.some(v=>v==='Loading'||v==='Setup'||v==='Returned'))overall='In Progress';else overall='Not Started';}else if(past)overall='Complete';if(overall==='Closed'){returnEventJobToStock(e);return 'Closed'}e.status=overall;e.progress=overall;return overall}
function setEventCategoryStatus(id,k,status){const e=data.events.find(x=>x.id===id);if(!e)return;const keys=eventCategoryKeys(e);if(!keys.includes(k))return;e.categoryStatuses=e.categoryStatuses||{};e.categoryStatuses[k]=status;const overall=refreshEventOverallStatus(e);logActivity({itemName:e.name,action:'Category status changed',job:e.name,progress:`${eventCategoryLabel(k).replace(/<[^>]+>/g,'')} → ${status}`,at:new Date().toISOString()});const j=data.jobs.find(x=>x.id===e.avJobId);if(j){j.progress=overall;j.status=overall==='Closed'?'Complete':overall==='Complete'?'Complete':'Open';}save();viewEventJob(id);renderEvents();if(googleAccessToken)syncGoogleEvent(e)}
function refreshAllEventStatuses(){let changed=false;(data.events||[]).forEach(e=>{const before=e.status;const beforeCats=JSON.stringify(e.categoryStatuses||{});refreshEventOverallStatus(e);if(before!==e.status||beforeCats!==JSON.stringify(e.categoryStatuses||{}))changed=true});if(changed){localStorage.setItem(KEY,JSON.stringify(data));scheduleCloudPush();}}

function showEventHistoryPhoto(eventId,itemId){const x=data.items.find(i=>i.id===itemId);if(x)return viewItem(x.id);const e=data.events.find(x=>x.id===eventId);const h=(e?.equipmentHistory||[]).find(i=>i.id===itemId);if(!h)return;openModal(`<h2>${esc(h.name||'Equipment')}</h2><div class="empty">No current photo available for this completed item.</div><p class="muted">Returned equipment</p>`)}

function viewEventJob(id){const e=data.events.find(x=>x.id===id);if(!e)return;refreshEventOverallStatus(e);const attached=data.items.filter(x=>x.jobId===e.avJobId);const section=(k)=>{const arr=eventSectionItems(e,k);return `<div class="card"><div class="section-head"><h3 style="margin:0">${eventSectionLabel(k)}</h3><button class="secondary" onclick="addBuildLine('${e.id}','${k}')">＋ Add</button></div>${arr.length?arr.map((x,i)=>`<div class="manage-row"><div class="manage-row-main event-item-click" onclick="showEventLineItem('${e.id}','${k}',${i})"><b>${Number(x.qty)||1} × ${esc(x.name)}</b>${x.notes?`<div class="manage-row-meta">${esc(x.notes)}</div>`:''}</div><div class="manage-actions"><button class="secondary" onclick="event.stopPropagation();editBuildLine('${e.id}','${k}',${i})">Edit</button><button class="danger" onclick="event.stopPropagation();deleteBuildLine('${e.id}','${k}',${i})">Remove</button></div></div>`).join(''):'<div class="empty">Nothing added yet.</div>'}</div>`};const pct=e.status==='Not Started'?0:e.status==='In Progress'?35:e.status==='Setup'?65:e.status==='Complete'?85:100;const categoryKeys=eventCategoryKeys(e);const categoryStatusHtml=categoryKeys.length?`<div class="card"><div class="section-head"><div><h3 style="margin:0">Category Status</h3><div class="muted">Set the status for each category that has equipment or build items.</div></div></div><div class="event-category-status">${categoryKeys.map(k=>{const st=eventCategoryStatus(e,k);return `<div class="event-category-status-card"><div class="event-category-status-head"><b>${eventCategoryLabel(k)}</b>${eventStatusBadge(st)}</div><div class="event-category-status-buttons">${['Not Started','Loading','Setup','Returned'].map(x=>`<button class="status-select-btn status-${eventStatusClass(x)} ${st===x?'active':''}" onclick="setEventCategoryStatus('${e.id}','${k}','${x}')">${x}</button>`).join('')}</div></div>`}).join('')}</div></div>`:'';openModal(`<h2>${esc(e.name)}</h2>${photoHtml(e.photo,'photo-hero')}<p class="muted">${esc(e.date||'')} • ${esc(e.status)}</p><div class="job-summary"><div class="row"><b>Overall status</b>${eventStatusBadge(e.status)}</div><div class="job-progress-track"><div class="job-progress-fill ${eventStatusFillClass(e.status)}" style="width:${pct}%"></div></div><div class="muted">Not Started → In Progress → Setup → Complete → Closed</div><div class="muted" style="margin-top:8px">📍 ${esc(e.what3words||'No What3words location')}</div>${e.what3words?`<div style="display:flex;gap:8px;margin-top:6px"><button class="maps-btn" style="flex:1" onclick="openWhat3WordsForValue('${esc(e.what3words)}')">📍 Open in What3words</button><button class="secondary" onclick="openWhat3WordsAppForValue('${esc(e.what3words)}')">🔎 Find</button></div>`:''}<div class="job-assignment"><div><span class="small">CREW</span><br><b>🧔 ${esc(eventCrewText(e))}</b></div><div><span class="small">VANS</span><br><b>🚐 ${esc(eventVanText(e))}</b></div></div><button class="secondary" style="width:100%;margin-top:8px" onclick="editEventJob('${e.id}')">✏️ Edit job details</button></div>${categoryStatusHtml}<h3>Build Sheet</h3>${section('marquee')}${section('portaloo')}<div class="card"><div class="section-head"><h3 style="margin:0">🔊 AV Equipment</h3><button class="secondary" onclick="checkoutToEvent('${e.id}')">＋ Add</button></div>${attached.length?attached.map(x=>`<div class="manage-row"><div class="manage-row-main event-item-click" onclick="viewItem('${x.id}')">${photoHtml(x.photo,'photo-thumb')}<div><b>${esc(x.name)}</b><div class="manage-row-meta">${esc(x.status)}</div></div></div><div class="manage-actions"><button class="secondary" onclick="viewItem('${x.id}')">View</button><button class="secondary" onclick="removeEventAV('${e.id}','${x.id}')">Remove</button></div></div>`).join(''):(e.equipmentHistory||[]).length?`<div class="muted">Completed equipment manifest</div>${e.equipmentHistory.map(x=>`<div class="manage-row event-item-click" onclick="showEventHistoryPhoto('$ function removeEventAV(eventId,itemId){const e=data.events.find(x=>x.id===eventId),x=data.items.find(i=>i.id===itemId);if(!e||!x)return;if(!confirm(`Remove ${x.name} from this job?`))return;x.status='Available';x.location='Warehouse';x.progress='Returned';x.jobId=null;x.job=null;x.userId='';x.vanId='';if(!data.items.some(i=>i.jobId===e.avJobId)){e.categoryStatuses=e.categoryStatuses||{};delete e.categoryStatuses.av;}refreshEventOverallStatus(e);save();viewEventJob(eventId);renderEvents();renderEquipment();if(googleAccessToken)syncGoogleEvent(e)}

function doCheckoutToEvent(eventId){const e=data.events.find(x=>x.id===eventId),x=data.items.find(i=>i.id===v('eventItemSelect'));if(!e||!x)return;const j=data.jobs.find(j=>j.id===e.avJobId);if(!j)return;x.status='Out';x.jobId=j.id;x.job=j.name;x.location=j.name;x.progress=null;e.categoryStatuses=e.categoryStatuses||{};e.categoryStatuses.av=e.categoryStatuses.av||'Not Started';refreshEventOverallStatus(e);e.equipmentHistory.push({id:x.id,name:x.name,asset:x.asset||''});logActivity({itemId:x.id,itemName:x.name,action:'Added to event job',job:e.name,at:new Date().toISOString()});save();closeModal();viewEventJob(eventId);render();if(googleAccessToken)syncGoogleEvent(e);}

function addBuildLine(eventId,k){const e=data.events.find(x=>x.id===eventId);if(!e)return;if(['portaloo','furniture','power','marquee'].includes(k)){const inv=stockInventoryForSection(k);const available=inv.filter(x=>stockAvailable(x)>0);if(!available.length)return alert(`No ${stockLabelForSection(k)} stock is currently available.`);openModal(`<h2>Add ${eventSectionLabel(k)}</h2><label>Item</label><select id="bl_inventory">${available.map(x=>`<option value="${x.id}">${esc(x.name)} • ${esc(x.asset||'')} • ${stockAvailable(x)} available</option>`).join('')}</select><label>Quantity</label><input id="bl_qty" type="number" min="1" max="${stockAvailable(available[0])}" value="1" onchange="updateBuildQtyMax(this,'bl_inventory')"><label>Notes / specification</label><input id="bl_notes"><button onclick="saveBuildInventory('${eventId}','${k}')">＋ Add to job</button>`);return}openModal(`<h2>Add ${eventSectionLabel(k)}</h2><label>Item / description</label><input id="bl_name" placeholder="${k==='marquee'?'40ft x 20ft frame tent':'Cable / distro / power requirement'}"><label>Quantity</label><input id="bl_qty" type="number" min="1" value="1"><label>Notes / specification</label><input id="bl_notes"><button onclick="saveBuildLine('${eventId}','${k}',-1)">＋ Add to build sheet</button>`)}
function updateBuildQtyMax(input,selectId){const id=document.getElementById(selectId)?.value;const inv=[...data.portalooEquipment,...data.furnitureProps].find(i=>i.id===id);if(inv){input.max=stockAvailable(inv);if(Number(input.value)>input.max)input.value=input.max;}}
function saveBuildInventory(eventId,k){const e=data.events.find(x=>x.id===eventId);if(!e)return;const inv=stockInventoryForSection(k);const x=inv.find(i=>i.id===v('bl_inventory'));const qty=Math.max(1,Number(v('bl_qty'))||1);if(!x||stockAvailable(x)<qty)return alert(`Only ${x?stockAvailable(x):0} available.`);allocateStock(x,e.id,qty);e.sections[k].push({name:x.name,qty,notes:v('bl_notes'),inventoryType:k,inventoryId:x.id,asset:x.asset||''});e.categoryStatuses=e.categoryStatuses||{};e.categoryStatuses[k]=e.categoryStatuses[k]||'Not Started';refreshEventOverallStatus(e);save();closeModal();viewEventJob(eventId);renderCreate();if(googleAccessToken)syncGoogleEvent(e)}
function editBuildLine(eventId,k,i){const x=data.events.find(e=>e.id===eventId)?.sections?.[k]?.[i];if(!x)return;openModal(`<h2>Edit ${eventSectionLabel(k)}</h2><label>Item / description</label><input id="bl_name" value="${esc(x.name)}" ${x.inventoryId?'disabled':''}><label>Quantity</label><input id="bl_qty" type="number" min="1" value="${Number(x.qty)||1}"><label>Notes / specification</label><input id="bl_notes" value="${esc(x.notes||'')}"><button onclick="saveBuildLine('${eventId}','${k}',${i})">Save changes</button>`)}
function saveBuildLine(eventId,k,i){const e=data.events.find(x=>x.id===eventId);if(!e)return;const old=e.sections[k]?.[i];if(old?.inventoryId){const inv=(old.inventoryType==='portaloo'?data.portalooEquipment:data.furnitureProps).find(x=>x.id===old.inventoryId);const oldQty=Number(old.qty)||1;const newQty=Math.max(1,Number(v('bl_qty'))||1);if(inv){if(newQty>oldQty&&!allocateStock(inv,e.id,newQty-oldQty))return alert(`Only ${stockAvailable(inv)} additional units are available.`);if(newQty<oldQty)releaseStock(inv,e.id,oldQty-newQty);}old.qty=newQty;old.notes=v('bl_notes');}else{const name=v('bl_name');if(!name)return alert('Enter an item or description');e.sections[k][i]={...(old||{}),name,qty:Math.max(1,Number(v('bl_qty'))||1),notes:v('bl_notes')};}e.categoryStatuses=e.categoryStatuses||{};e.categoryStatuses[k]=e.categoryStatuses[k]||'Not Started';refreshEventOverallStatus(e);save();closeModal();viewEventJob(eventId);if(googleAccessToken)syncGoogleEvent(e)}
function deleteBuildLine(eventId,k,i){const e=data.events.find(x=>x.id===eventId);if(!e)return;if(!confirm('Remove this build-sheet item from the job?'))return;const line=e.sections[k][i];if(line?.inventoryId){const inv=(line.inventoryType==='portaloo'?data.portalooEquipment:data.furnitureProps).find(x=>x.id===line.inventoryId);if(inv)releaseStock(inv,e.id,Number(line.qty)||1);}e.sections[k].splice(i,1);if(!e.sections[k].length){e.categoryStatuses=e.categoryStatuses||{};delete e.categoryStatuses[k];}refreshEventOverallStatus(e);save();viewEventJob(eventId);renderCreate();if(googleAccessToken)syncGoogleEvent(e)}
function editEventJob(id){const e=data.events.find(x=>x.id===id);if(!e)return;openModal(`<h2>Edit Event Job</h2><label>Event / job name</label><input id="ee_name" value="${esc(e.name)}"><label>Date</label><input id="ee_date" type="date" value="${esc(e.date||'')}"><label>What3words location</label><input id="ee_w3w" value="${esc(e.what3words||'')}" placeholder="///filled.count.soap"><div style="display:flex;gap:8px"><button class="maps-btn" style="flex:1" onclick="openWhat3WordsFor('ee_w3w')">📍 Open in What3words</button><button class="secondary" type="button" onclick="openWhat3WordsAppFor('ee_w3w')">🔎 Find</button></div><label>Customer / company</label><input id="ee_customer" value="${esc(e.customer?.name||e.customer?.company||'')}"><label>Phone</label><input id="ee_phone" value="${esc(e.customer?.phone||'')}"><label>Email</label><input id="ee_email" value="${esc(e.customer?.email||'')}"><label>Job photo</label><input class="photo-input" id="ee_photo" type="file" accept="image/*"><label>General notes</label><textarea id="ee_notes" rows="4" style="width:100%;padding:11px;border:1px solid #d1d5db;border-radius:9px;font:inherit">${esc(e.notes||'')}</textarea><h3>Crew</h3><label class="multi-row"><input type="checkbox" style="width:22px;height:22px;margin:0" onchange="toggleAllCrew('edit-event-user',this.checked)"><span><b>Assign all crew</b></span></label><div class="multi-list">${crewUsers().map(u=>`<label class="multi-row"><input class="edit-event-user" type="checkbox" value="${u.id}" ${(e.userIds||[]).includes(u.id)?'checked':''}><span>${esc(u.name)}</span></label>`).join('')}</div><h3>Vehicles</h3><div class="multi-list">${data.vans.map(vn=>`<label class="multi-row"><input class="edit-event-van" type="checkbox" value="${vn.id}" ${(e.vanIds||[]).includes(vn.id)?'checked':''}><span>${esc(vn.name)}</span></label>`).join('')}</div><button onclick="saveEventEdit('${id}')">Save changes</button><div style="height:18px"></div><button class="danger" style="width:100%" onclick="deleteEventJob('${id}')">Delete job</button>`);}
async function saveEventEdit(id){const e=data.events.find(x=>x.id===id);if(!e)return;const name=v('ee_name');if(!name)return alert('Enter a job name');const photo=await photoFromInput('ee_photo');e.name=name;e.date=v('ee_date');e.what3words=v('ee_w3w');e.notes=v('ee_notes');e.customer={name:v('ee_customer'),company:'',phone:v('ee_phone'),email:v('ee_email')};e.userIds=[...document.querySelectorAll('.edit-event-user:checked')].map(x=>x.value);e.vanIds=[...document.querySelectorAll('.edit-event-van:checked')].map(x=>x.value);if(photo)e.photo=photo;const j=data.jobs.find(x=>x.id===e.avJobId);if(j){j.name=e.name;j.date=e.date;j.what3words=e.what3words;j.userIds=e.userIds;j.vanIds=e.vanIds;j.photo=e.photo;}save();closeModal();viewEventJob(id);renderEvents();if(googleAccessToken)syncGoogleEvent(e);}

function completeEventJob(id){const e=data.events.find(x=>x.id===id);if(!e)return;if(!confirm(`Close ${e.name}? All attached equipment and stock will be returned to stock. The equipment names will remain on the job sheet for the job history.`))return;returnEventJobToStock(e);save();viewEventJob(id);renderEvents();renderEquipment();renderCreate();if(googleAccessToken)syncGoogleEvent(e);}
function reopenEventJob(id){const e=data.events.find(x=>x.id===id);if(!e)return;const invLines=Object.values(e.sections||{}).flat().filter(x=>x.inventoryId);for(const line of invLines){const inv=inventoryForEventLine(line);if(!inv)continue;const q=Number(line.qty)||1;if(stockAvailable(inv)<q)return alert(`Not enough ${inv.name} stock is available to reopen this event.`);}const history=e.equipmentHistory||[];for(const h of history){const item=data.items.find(x=>x.id===h.id);if(!item)continue;if(item.jobId&&item.jobId!==e.avJobId)return alert(`${item.name} is currently assigned to another job and cannot be reopened.`);}for(const line of invLines){const inv=inventoryForEventLine(line);if(inv)allocateStock(inv,e.id,Number(line.qty)||1);}for(const h of history){const item=data.items.find(x=>x.id===h.id);if(!item)continue;item.status='Out';item.jobId=e.avJobId;item.job=e.name;item.progress='Picked';item.location='On Job';}e.categoryStatuses=e.categoryStatuses||{};Object.keys(e.categoryStatuses).forEach(k=>e.categoryStatuses[k]='Not Started');e.status='Not Started';e.progress='Not Started';e.completedAt=null;const j=data.jobs.find(x=>x.id===e.avJobId);if(j){j.status='Open';j.progress='Not Started';j.completedAt=null;}save();viewEventJob(id);renderEvents();renderCreate();renderEquipment();if(googleAccessToken)syncGoogleEvent(e);}
function deleteEventJob(id){const e=data.events.find(x=>x.id===id);if(!e)return;const attached=data.items.filter(x=>x.jobId===e.avJobId);const otherAttached=[...(e.sections.portaloo||[]),...(e.sections.furniture||[])].filter(line=>{const arr=line.inventoryType==='portaloo'?data.portalooEquipment:data.furnitureProps;const inv=line.inventoryId&&arr.find(x=>x.id===line.inventoryId);return inv&&stockUsedForJob(inv,e.id)>0});openModal(`<h2>Delete Event Job?</h2><p>Delete <b>${esc(e.name)}</b>?</p>${attached.length?`<p class="muted">${attached.length} AV item(s) are still attached. Return them before deleting.</p>`:''}${otherAttached.length?`<p class="muted">${otherAttached.length} Portaloo/furniture item(s) are still attached. Remove them from the build sheet before deleting.</p>`:''}<div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button>${attached.length||otherAttached.length?'':`<button class="danger" onclick="confirmDeleteEventJob('${id}')">Yes, delete job</button>`}</div>`);}
function confirmDeleteEventJob(id){const e=data.events.find(x=>x.id===id);if(!e)return;const j=data.jobs.find(x=>x.id===e.avJobId);if(j)data.jobs=data.jobs.filter(x=>x.id!==j.id);data.events=data.events.filter(x=>x.id!==id);save();closeModal();showPage('events');if(googleAccessToken)deleteGoogleEvent(e);}

function renderMarquee(){const el=document.getElementById('marquee');if(!el)return;const jobs=data.marqueeJobs||[];const head=`<div class="card"><div class="section-head"><h2>Marquee Jobs</h2><button onclick="newMarqueeJob()">＋ Create job</button></div><div class="muted">Plan marquee builds, assign crew and vans, track progress and keep site locations with What3words.</div></div>`;if(!jobs.length){el.innerHTML=head+'<div class="card empty">No Marquee jobs yet.<br>Tap <b>Create job</b> to get started.</div>';return;}const active=jobs.filter(j=>j.status!=='Complete').slice().reverse(),completed=jobs.filter(j=>j.status==='Complete').slice().reverse();const card=j=>`<div class="job-summary ${j.status==='Complete'?'job-complete':''}"><div class="row"><div style="flex:1"><div class="job-summary-title">${esc(j.name)}</div><div class="job-summary-sub">${esc(j.date||'')} • ${esc(j.status)}${j.size?' • '+esc(j.size):''}</div></div><span class="badge ${j.status==='Complete'?'complete':''}">${esc(j.status)}</span></div><div class="job-assignment"><div><span class="small">CREW</span><br><b>👤 ${esc(marqueeCrewText(j))}</b></div><div><span class="small">VANS</span><br><b>🚐 ${esc(marqueeVanText(j))}</b></div></div><div class="muted">📍 ${esc(j.what3words||'No What3words location')}</div><div class="actions"><button onclick="viewMarqueeJob('${j.id}')">Open Job</button>${j.status==='Complete'?`<button class="secondary" onclick="reopenMarqueeJob('${j.id}')">Reopen Job</button>`:`<button class="green" onclick="completeMarqueeJob('${j.id}')">Complete Job</button>`}<button class="danger" onclick="deleteMarqueeJob('${j.id}')">Delete Job</button></div></div>`;let html=head;if(active.length)html+=active.map(card).join('');if(completed.length)html+=`<div class="completed-heading"><h2>Completed Marquee Jobs</h2><div class="muted">Completed jobs are kept here for reference and can be reopened.</div></div>`+completed.map(card).join('');el.innerHTML=html;}

function portalooCrewText(j){
 const a=(j.userIds||[]).map(userName).filter(x=>x!=='Unassigned');
 return a.length?a.join(', '):'Unassigned';
}
function portalooUnitTotal(j){if(j.stockAllocations&&Object.keys(j.stockAllocations).length)return Object.values(j.stockAllocations).reduce((n,q)=>n+(Number(q)||0),0);return (Number(j.unit1)||0)+(Number(j.unit2)||0)+(Number(j.unit3)||0)}
function portalooStatusBadge(status){const cls=String(status||'').toLowerCase().replace(/\s+/g,'-');return `<span class="badge portaloo-status-${cls}">${esc(status)}</span>`}
function portalooDateText(j){
 if(j.rolling)return `${esc(j.startDate||'')} • Rolling`; 
 if(j.endDate)return `${esc(j.startDate||'')} → ${esc(j.endDate)}`;
 return `${esc(j.startDate||'')} • Ongoing`;
}
function mapsUrl(address){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(address||'')}
function toggleClosedPortalooJobs(){data.settings.showClosedPortalooJobs=data.settings.showClosedPortalooJobs===false;save();renderPortaloo();}
function portalooAutoCollectDueJobs(){
 const today=new Date();today.setHours(0,0,0,0);let changed=false;
 (data.portalooJobs||[]).forEach(j=>{
  if(j.status==='Closed'||j.rolling||!j.endDate)return;
  const end=new Date(j.endDate+'T00:00:00');
  if(end<=today && j.status!=='Collect'){
   j.status='Collect';j.collectNotifiedAt=new Date().toISOString();changed=true;
   addNotification('alert','Portaloo collection due',`${j.name}: the hire end date has been reached. Collection is due.`,`portaloo-collect-${j.id}-${j.endDate}`,{phone:true});
   logActivity({itemName:j.name,action:'Portaloo collection requested',job:j.name,at:new Date().toISOString()});
  }
 });
 if(changed)save();
}
function renderPortaloo(){
 const el=document.getElementById('portaloo'); if(!el)return;
 portalooAutoCollectDueJobs();
 const jobs=data.portalooJobs||[];
 const active=jobs.filter(j=>j.status!=='Closed').length;
 const units=jobs.filter(j=>j.status!=='Closed').reduce((n,j)=>n+portalooUnitTotal(j),0);
 const head=`<div class="card"><div class="section-head"><h2>Portaloo Jobs</h2><div class="actions" style="margin-top:0"><button onclick="newPortalooJob()">＋ Create job</button></div></div><div class="muted">Manage toilet hire, servicing, customers and site details. Long-term hires stay separate from Event Jobs.</div></div>
 <div class="portaloo-stat-grid"><div class="portaloo-stat"><b>${active}</b><span>Active jobs</span></div><div class="portaloo-stat"><b>${units}</b><span>Units out</span></div></div>`;
 if(!jobs.length){el.innerHTML=head+'<div class="card empty">No Portaloo jobs yet.<br>Tap <b>Create job</b> to get started.</div>';return;}
 const activeJobs=jobs.filter(j=>j.status!=='Closed').slice().reverse();
 const closedJobs=jobs.filter(j=>j.status==='Closed').slice().reverse();
 let html=head;

function portalooServiceDueDate(j){
 const today=new Date(); today.setHours(0,0,0,0);
 if(j.nextServiceDate)return j.nextServiceDate;
 const services=(j.services||[]).filter(s=>s.date).slice().sort((a,b)=>String(b.date).localeCompare(String(a.date)));
 const base=services[0]?.date||j.startDate; if(!base)return '';
 const d=new Date(base+'T00:00:00'); d.setDate(d.getDate()+7); return d.toISOString().slice(0,10);
}
function portalooServiceDueText(j){
 const due=portalooServiceDueDate(j); if(!due)return 'Service date not set';
 const d=new Date(due+'T00:00:00'); const today=new Date(); today.setHours(0,0,0,0);
 const diff=Math.round((d-today)/86400000);
 if(diff<0)return `⚠️ Service overdue by ${Math.abs(diff)} day${Math.abs(diff)===1?'':'s'}`;
 if(diff===0)return '🔧 Service due today'; if(diff===1)return '🔧 Service due tomorrow';
 return `🔧 Next service ${d.toLocaleDateString('en-GB')}`;
}
function portalooServiceDueClass(j){const due=portalooServiceDueDate(j);if(!due)return '';const d=new Date(due+'T00:00:00');const today=new Date();today.setHours(0,0,0,0);return d<today?' service-overdue':d.getTime()===today.getTime()?' service-today':'';}

function addPortalooStockToJob(id){const j=data.portalooJobs.find(x=>x.id===id);if(!j)return;openModal(`<h2>Add Portaloo stock</h2><p class="muted">Choose the quantity to add to <b>${esc(j.name)}</b>. Stock is reserved from the shared Portaloo inventory.</p><div>${portalooStockBookingHTML('addstock',j.stockAllocations||{})}</div><button onclick="saveAddedPortalooStock('${id}')">＋ Add to hire</button>`)}
function saveAddedPortalooStock(id){const j=data.portalooJobs.find(x=>x.id===id);if(!j)return;const requested=readPortalooStockBooking();const existing=j.stockAllocations||{};for(const [stockId,q] of Object.entries(requested)){const old=Number(existing[stockId])||0;const delta=q-old;if(delta>0){const x=data.portalooEquipment.find(i=>i.id===stockId);if(!x||stockAvailable(x)<delta)return alert(`Not enough ${x?.name||'Portaloo stock'} available.`)}}releasePortalooJobStock(j,true);j.stockAllocations=requested;applyPortalooJobStock(j,requested);save();closeModal();viewPortalooJob(id);renderPortaloo();if(googleAccessToken)syncGoogleJob(j,'portaloo').catch(e=>console.error(e))}
function removePortalooStockFromJob(jobId,stockId){const j=data.portalooJobs.find(x=>x.id===jobId);if(!j)return;const current=Number(j.stockAllocations?.[stockId])||0;if(!current)return;const name=data.portalooEquipment.find(x=>x.id===stockId)?.name||'Portaloo stock';openModal(`<h2>Remove stock?</h2><p>How many <b>${esc(name)}</b> should be removed from this hire?</p><input id="remove_stock_qty" type="number" min="1" max="${current}" value="1"><div class="actions"><button class="secondary" onclick="closeModal()">Cancel</button><button class="danger" onclick="confirmRemovePortalooStock('${jobId}','${stockId}')">Remove</button></div>`)}
function confirmRemovePortalooStock(jobId,stockId){const j=data.portalooJobs.find(x=>x.id===jobId);if(!j)return;const qty=Math.min(Number(j.stockAllocations?.[stockId])||0,Math.max(1,Number(v('remove_stock_qty'))||1));if(!qty)return;const x=data.portalooEquipment.find(i=>i.id===stockId);if(x)releaseStock(x,j.id,qty);j.stockAllocations[stockId]=Math.max(0,(Number(j.stockAllocations[stockId])||0)-qty);if(!j.stockAllocations[stockId])delete j.stockAllocations[stockId];save();closeModal();viewPortalooJob(jobId);renderPortaloo();if(googleAccessToken)syncGoogleJob(j,'portaloo').catch(e=>console.error(e))}

function setPortalooStatus(id,status){
 const j=data.portalooJobs.find(x=>x.id===id);if(!j)return;
